<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Sign In | Reh</title>

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Great+Vibes&display=swap"
			rel="stylesheet"
		/>

		<!-- Font Awesome 6 -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		/>
		<link rel="stylesheet" href="assets/main.css" />

		<script type="module" src="assets/firebase.js"></script>

		<style>
			:root {
				--deep-navy: #080c24;
				--sapphire: #0f1b4a;
				--royal-blue: #162464;
				--crimson: #8b1a2b;
				--ruby: #a82035;
				--rose: #c0394b;
				--gold: #c9a84c;
				--gold-light: #dfc278;
				--champagne: #f0e4c8;
				--pure-white: #ffffff;
				--glass-bg: rgba(255, 255, 255, 0.03);
				--glass-border: rgba(255, 255, 255, 0.08);
				--text-primary: #f0ece6;
				--text-secondary: #c5bfb3;
				--text-muted: #8a857a;
				--love-pink: #ff6b8a;
				--love-rose: #f0a0b0;
				--transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
				--transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
			}

			*,
			*::before,
			*::after {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html {
				scroll-behavior: smooth;
				font-size: 16px;
				-webkit-font-smoothing: antialiased;
			}

			body {
				font-family: "Inter", system-ui, sans-serif;
				background: var(--deep-navy);
				color: var(--text-primary);
				min-height: 100vh;
				overflow-x: hidden;
				line-height: 1.6;
				letter-spacing: 0.01em;
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 2rem;
			}

			::selection {
				color: var(--champagne);
				background: rgba(180, 30, 50, 0.5);
			}

			/* ── Animated Background ─────────────────── */
			.bg-orbit {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 0;
				overflow: hidden;
			}
			.bg-orbit::before {
				content: "";
				position: absolute;
				top: -30%;
				left: -20%;
				width: 140%;
				height: 160%;
				background:
					radial-gradient(
						ellipse at 50% 40%,
						rgba(255, 107, 138, 0.12) 0%,
						transparent 55%
					),
					radial-gradient(
						ellipse at 60% 60%,
						rgba(200, 160, 60, 0.08) 0%,
						transparent 55%
					),
					radial-gradient(
						ellipse at 40% 80%,
						rgba(20, 40, 120, 0.15) 0%,
						transparent 55%
					),
					radial-gradient(
						ellipse at 70% 20%,
						rgba(180, 30, 50, 0.15) 0%,
						transparent 55%
					);
				animation: bgPulse 10s ease-in-out infinite;
			}
			@keyframes bgPulse {
				0%,
				100% {
					opacity: 0.9;
					transform: scale(1);
				}
				50% {
					opacity: 1;
					transform: scale(1.02);
				}
			}

			/* ── Floating Hearts ─────────────────────── */
			.hearts-container {
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 1;
			}
			.floating-heart {
				position: absolute;
				color: var(--love-pink);
				font-size: 1.4rem;
				animation: floatHeart 7s ease-in-out infinite;
				opacity: 0;
				filter: drop-shadow(0 0 8px rgba(255, 107, 138, 0.5));
				pointer-events: none;
			}
			.floating-heart:nth-child(odd) {
				color: var(--gold-light);
				filter: drop-shadow(0 0 8px rgba(200, 160, 60, 0.5));
			}
			@keyframes floatHeart {
				0% {
					transform: translateY(105vh) translateX(0) scale(0.5) rotate(0deg);
					opacity: 0;
				}
				10% {
					opacity: 1;
					transform: translateY(80vh) translateX(15px) scale(1) rotate(10deg);
				}
				50% {
					opacity: 0.9;
					transform: translateY(40vh) translateX(-20px) scale(1.2) rotate(-5deg);
				}
				80% {
					opacity: 0.4;
					transform: translateY(10vh) translateX(25px) scale(0.8) rotate(20deg);
				}
				100% {
					opacity: 0;
					transform: translateY(-5vh) translateX(0) scale(0.3) rotate(0deg);
				}
			}

			/* ── Main Card ───────────────────────────── */
			.signin-card {
				position: relative;
				z-index: 2;
				width: 100%;
				max-width: 450px;
				background: rgba(15, 20, 50, 0.55);
				backdrop-filter: blur(25px);
				-webkit-backdrop-filter: blur(25px);
				border: 1px solid var(--glass-border);
				border-radius: 32px;
				padding: 3rem 2.5rem 2.5rem;
				box-shadow:
					0 25px 60px rgba(0, 0, 0, 0.45),
					0 0 40px rgba(200, 155, 60, 0.15);
				animation: cardAppear 0.9s var(--transition-bounce);
				transition: box-shadow 0.4s;
				text-align: center;
			}
			.signin-card:hover {
				box-shadow:
					0 30px 70px rgba(0, 0, 0, 0.6),
					0 0 60px rgba(200, 155, 60, 0.25);
			}
			@keyframes cardAppear {
				from {
					opacity: 0;
					transform: translateY(30px) scale(0.96);
				}
				to {
					opacity: 1;
					transform: translateY(0) scale(1);
				}
			}

			.signin-card::before {
				content: "";
				position: absolute;
				inset: -2px;
				border-radius: 32px;
				padding: 2px;
				background: linear-gradient(
					160deg,
					rgba(255, 107, 138, 0.5) 0%,
					rgba(200, 160, 70, 0.4) 30%,
					rgba(20, 45, 130, 0.4) 60%,
					rgba(255, 150, 180, 0.5) 100%
				);
				-webkit-mask:
					linear-gradient(#fff 0 0) content-box,
					linear-gradient(#fff 0 0);
				mask:
					linear-gradient(#fff 0 0) content-box,
					linear-gradient(#fff 0 0);
				-webkit-mask-composite: xor;
				mask-composite: exclude;
				pointer-events: none;
				opacity: 0.8;
				z-index: 0;
			}

			.signin-card > * {
				position: relative;
				z-index: 1;
			}

			.brand-icon {
				width: 64px;
				height: 64px;
				margin: 0 auto 1.2rem;
				background: linear-gradient(135deg, var(--rose), var(--royal-blue));
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 1.8rem;
				color: var(--gold-light);
				box-shadow: 0 0 30px rgba(255, 107, 138, 0.5);
				animation: iconPulse 2.5s infinite;
			}
			@keyframes iconPulse {
				0%,
				100% {
					transform: scale(1);
					box-shadow: 0 0 30px rgba(255, 107, 138, 0.4);
				}
				50% {
					transform: scale(1.08);
					box-shadow: 0 0 45px rgba(255, 107, 138, 0.8);
				}
			}

			.signin-title {
				font-family: "Playfair Display", serif;
				font-size: 2.3rem;
				font-weight: 700;
				letter-spacing: 0.02em;
				margin-bottom: 0.5rem;
				background: linear-gradient(
					180deg,
					#ffffff 0%,
					#f0d9b0 40%,
					var(--gold) 100%
				);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
				filter: drop-shadow(0 2px 6px rgba(200, 150, 50, 0.3));
			}
			.signin-subtitle {
				font-family: "Cormorant Garamond", serif;
				font-size: 1.1rem;
				font-style: italic;
				color: var(--text-secondary);
				margin-bottom: 2rem;
				line-height: 1.5;
			}

			.members-counter {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				background: rgba(255, 255, 255, 0.04);
				border: 1px solid var(--glass-border);
				border-radius: 50px;
				padding: 8px 20px;
				margin-bottom: 2rem;
				font-size: 0.8rem;
				color: var(--text-secondary);
				backdrop-filter: blur(8px);
				width: fit-content;
				margin-left: auto;
				margin-right: auto;
			}
			.members-counter i {
				color: var(--love-pink);
				animation: heartBeat 1.4s infinite;
			}
			@keyframes heartBeat {
				0%,
				100% {
					transform: scale(1);
				}
				25% {
					transform: scale(1.3);
				}
				50% {
					transform: scale(1);
				}
				75% {
					transform: scale(1.2);
				}
			}
			.members-counter span {
				font-weight: 700;
				color: var(--gold-light);
				letter-spacing: 0.03em;
			}

			.form-group {
				margin-bottom: 1.5rem;
				text-align: left;
			}
			.form-group label {
				display: block;
				font-size: 0.72rem;
				color: var(--text-secondary);
				margin-bottom: 0.3rem;
				letter-spacing: 0.04em;
				font-weight: 500;
				display: flex;
				align-items: center;
				gap: 0.3rem;
			}
			.form-group input {
				width: 100%;
				padding: 12px 16px;
				background: rgba(255, 255, 255, 0.04);
				border: 1px solid var(--glass-border);
				border-radius: 14px;
				color: white;
				font-family: "Inter", sans-serif;
				font-size: 0.9rem;
				transition: 0.3s;
				outline: none;
			}
			.form-group input:focus {
				border-color: var(--love-pink);
				box-shadow: 0 0 18px rgba(255, 107, 138, 0.25);
			}

			.btn-signin {
				width: 100%;
				padding: 14px;
				background: linear-gradient(
					135deg,
					var(--ruby),
					var(--love-pink),
					var(--crimson)
				);
				border: none;
				border-radius: 14px;
				color: white;
				font-weight: 700;
				font-size: 1rem;
				letter-spacing: 0.05em;
				cursor: pointer;
				transition: all 0.35s var(--transition-smooth);
				box-shadow: 0 8px 25px rgba(255, 107, 138, 0.5);
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				margin-top: 0.5rem;
			}
			.btn-signin:hover {
				background: linear-gradient(135deg, #ff5e7a, #ff8fa3, #c0394b);
				transform: translateY(-2px);
				box-shadow: 0 15px 35px rgba(255, 107, 138, 0.8);
			}
			.btn-signin:active {
				transform: scale(0.98);
			}
			.btn-back {
				background: transparent;
				border: 1px solid var(--glass-border);
				color: var(--text-secondary);
				padding: 10px 20px;
				border-radius: 50px;
				cursor: pointer;
				font-weight: 600;
				font-size: 0.85rem;
				transition: 0.3s;
				margin-left: 1rem;
			}
			.btn-back:hover {
				border-color: var(--gold-light);
				color: var(--champagne);
			}

			.extra-links {
				margin-top: 1.5rem;
				font-size: 0.8rem;
				color: var(--text-muted);
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}
			.extra-links a {
				color: var(--gold-light);
				text-decoration: none;
				font-weight: 600;
				transition: color 0.3s;
			}
			.extra-links a:hover {
				color: var(--love-rose);
			}
			.divider {
				color: var(--text-muted);
				margin: 0 0.3rem;
			}

			/* ── Toast ────────────────────────────────── */
			.toast {
				position: fixed;
				bottom: 30px;
				left: 50%;
				transform: translateX(-50%) translateY(100px);
				background: rgba(20, 30, 60, 0.9);
				backdrop-filter: blur(20px);
				border: 1px solid var(--gold);
				color: var(--champagne);
				padding: 14px 28px;
				border-radius: 50px;
				font-size: 0.85rem;
				font-weight: 500;
				z-index: 999;
				transition: transform 0.4s var(--transition-bounce);
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
				pointer-events: none;
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.toast.show {
				transform: translateX(-50%) translateY(0);
			}

			/* ── Responsive ──────────────────────────── */
			@media (max-width: 600px) {
				.signin-card {
					padding: 2rem 1.5rem;
					border-radius: 28px;
				}
				.signin-title {
					font-size: 1.8rem;
				}
				.brand-icon {
					width: 50px;
					height: 50px;
					font-size: 1.3rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="bg-orbit"></div>
		<div class="hearts-container" id="heartsContainer"></div>
		<div class="toast" id="toast">
			<i class="fa-solid fa-heart"></i> <span id="toastMessage"></span>
		</div>

		<div class="signin-card">
			<!-- Navigation -->
			<nav class="nav invisible"></nav>
			<!-- Sidebar -->
			<aside class="sidebar invisible" id="sidebar"></aside>
			<div class="brand-icon">
				<i class="fa-solid fa-gem"></i>
			</div>
			<h1 class="signin-title">Welcome Back, Dear One</h1>
			<p class="signin-subtitle">
				Your circle has been waiting. Pick up right where magic left off.
			</p>

			<div class="members-counter">
				<i class="fa-solid fa-heart"></i>
				<span id="memberCount">2,468,573</span> members
			</div>

			<form id="signinForm">
				<div class="form-group">
					<label><i class="fa-solid fa-envelope"></i> Email Address</label>
					<input
						type="email"
						placeholder="you@example.com"
						id="email"
						required
					/>
				</div>
				<div class="form-group">
					<label><i class="fa-solid fa-lock"></i> Password</label>
					<input
						type="password"
						placeholder="Your password"
						id="password"
						required
					/>
				</div>
				<div
					class="form-group"
					style="display: flex; align-items: center; gap: 0.5rem"
				>
					<input type="checkbox" id="rememberMe" checked style="width: auto" />
					<label
						for="rememberMe"
						style="
							margin: 0;
							font-size: 0.8rem;
							color: var(--text-secondary);
							cursor: pointer;
						"
					>
						Remember me on this device
					</label>
				</div>
				<button type="submit" class="btn-signin">
					<i class="fa-solid fa-arrow-right-to-bracket"></i> Enter the Circle
				</button>
			</form>

			<div class="extra-links">
				<a href="index?redirect=recovery"
					><i class="fa-solid fa-key"></i> Forgot your password?</a
				>
				<div>
					<span class="divider">Don't have an account yet?</span>
					<a href="index?redirect=register"
						><i class="fa-solid fa-user-plus"></i> Join the Circle</a
					>
				</div>
			</div>
			<footer class="footer invisible"></footer>
		</div>

		<script>
			// ─── Vercel Analytics bootstrap (inline + synchronous, always runs) ───
			window.va =
				window.va ||
				function () {
					(window.vaq = window.vaq || []).push(arguments);
				};
		</script>
		<script>
			// ─── Analytics loader with team-account exclusion ───
			(function () {
				var ANALYTICS_SKIP_EMAILS = [
					"rehcrown@gmail.com", // Boss
					// 'gem@example.com',
					// 'dev@example.com',
				];

				function loadAnalytics() {
					var s = document.createElement("script");
					s.src = "/_vercel/insights/script.js";
					document.head.appendChild(s);
				}

				try {
					var session = {};
					try {
						session = JSON.parse(localStorage.getItem("reh_user") || "{}");
					} catch (e) {}

					var userEmail = (session.email || "").toLowerCase().trim();
					var params = new URLSearchParams(window.location.search);

					var skipByUrl = params.has("noanalytics");
					var skipByFlag =
						localStorage.getItem("reh_skip_analytics") === "true";
					var skipByAccount =
						!!userEmail && ANALYTICS_SKIP_EMAILS.indexOf(userEmail) !== -1;

					if (skipByUrl || skipByFlag || skipByAccount) {
						console.log(
							"[analytics] Skipped — reason:",
							skipByUrl
								? "url param"
								: skipByFlag
									? "localStorage flag"
									: "team account",
						);
						return;
					}

					loadAnalytics();
				} catch (err) {
					loadAnalytics();
				}
			})();
		</script>

		<script src="assets/general.js"></script>
		<script type="module" src="assets/auth.js"></script>

		<script>
			(function () {
				// ── Firebase readiness helper ──────────
				function waitForFirebase(callback) {
					if (window.db) {
						callback();
					} else {
						let attempts = 0;
						const check = setInterval(() => {
							if (window.db) {
								clearInterval(check);
								callback();
							}
							attempts++;
							if (attempts > 50) {
								clearInterval(check);
								console.error("Firebase failed to load");
							}
						}, 100);
					}
				}

				function startApp() {
					// ── Floating Hearts ───────────────────────
					const heartsContainer = document.getElementById("heartsContainer");
					const heartIcons = ["❤️", "💕", "💖", "💗", "💘", "✨", "🌸"];
					const goldHearts = ["💛", "⭐", "🌟"];

					function createHeart() {
						const heart = document.createElement("span");
						heart.className = "floating-heart";
						const allIcons = Math.random() > 0.7 ? goldHearts : heartIcons;
						heart.textContent =
							allIcons[Math.floor(Math.random() * allIcons.length)];
						heart.style.left = Math.random() * 100 + "%";
						heart.style.animationDuration = Math.random() * 8 + 6 + "s";
						heart.style.animationDelay = Math.random() * 5 + "s";
						heart.style.fontSize = Math.random() * 1.5 + 1 + "rem";
						heartsContainer.appendChild(heart);
						setTimeout(() => heart.remove(), 12000);
					}
					setInterval(createHeart, 400);
					for (let i = 0; i < 12; i++) {
						setTimeout(createHeart, i * 200);
					}

					// ── Toast ────────────────────────────────
					const toast = document.getElementById("toast");
					const toastMessage = document.getElementById("toastMessage");
					let toastTimer;
					function showToast(message) {
						if (toastTimer) clearTimeout(toastTimer);
						toastMessage.textContent = message;
						toast.classList.add("show");
						toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
					}

					// ── Member count animation ──────────────
					const memberSpan = document.getElementById("memberCount");
					let current = 2468573;
					function incrementMemberCount() {
						const newMembers = Math.floor(Math.random() * 3) + 1;
						current += newMembers;
						memberSpan.textContent = current.toLocaleString();
					}
					setInterval(incrementMemberCount, 8000);

					// ── Login handler (Firestore) ────────────
					// ── Login handler (Firebase Auth + first-login bridge) ───
					document
						.getElementById("signinForm")
						.addEventListener("submit", async function (e) {
							e.preventDefault();
							const btn = document.querySelector(".btn-signin");
							const originalHTML = btn.innerHTML;

							const emailRaw = document.getElementById("email").value;
							const normalizedEmail = emailRaw.trim().toLowerCase();
							const password = document.getElementById("password").value;
							const remember = document.getElementById("rememberMe").checked;

							if (!normalizedEmail || !password) {
								showToast("🌸 Please enter your email and password.");
								return;
							}

							btn.disabled = true;
							btn.innerHTML =
								'<i class="fa-solid fa-spinner fa-spin"></i> Signing in…';

							// Clear any stale session before writing new one
							localStorage.removeItem("reh_user");
							sessionStorage.removeItem("reh_user");

							try {
								// 1. Set persistence BEFORE sign-in
								await window.setPersistence(
									window.auth,
									remember
										? window.browserLocalPersistence
										: window.browserSessionPersistence,
								);

								// 2. Try Firebase Auth first
								let cred;
								try {
									cred = await window.signInWithEmailAndPassword(
										window.auth,
										normalizedEmail,
										password,
									);
								} catch (authErr) {
									// 3. First-login bridge for pre-migration Firestore-only users
									if (
										authErr.code === "auth/user-not-found" ||
										authErr.code === "auth/invalid-credential" ||
										authErr.code === "auth/wrong-password"
									) {
										const userRef = window.doc(
											window.db,
											"users",
											normalizedEmail,
										);
										const userSnap = await window.getDoc(userRef);

										if (
											userSnap.exists() &&
											userSnap.data().password === password &&
											!userSnap.data().authMigrated
										) {
											// Pre-migration user with matching Firestore password
											try {
												cred = await window.createUserWithEmailAndPassword(
													window.auth,
													normalizedEmail,
													password,
												);
											} catch (createErr) {
												if (createErr.code === "auth/email-already-in-use") {
													// User exists in Auth with a different password.
													// Not a bridge case — treat as wrong password.
													throw new Error("Incorrect email or password.");
												}
												throw createErr;
											}
										} else {
											throw new Error("Incorrect email or password.");
										}
									} else {
										throw authErr;
									}
								}

								// 4. Cleanup — best-effort, never blocks login
								try {
									const cleanupSnap = await window.getDoc(
										window.doc(window.db, "users", normalizedEmail),
									);
									if (cleanupSnap.exists() && cleanupSnap.data().password) {
										await window.updateDoc(
											window.doc(window.db, "users", normalizedEmail),
											{ password: window.deleteField(), authMigrated: true },
										);
									}
								} catch (cleanupErr) {
									console.warn(
										"[login] password cleanup deferred:",
										cleanupErr,
									);
								}

								// 5. Fetch profile from Firestore
								const profileSnap = await window.getDoc(
									window.doc(window.db, "users", normalizedEmail),
								);
								const profile = profileSnap.exists() ? profileSnap.data() : {};

								// 6. Build session — no password, no tokens
								const session = {
									email: normalizedEmail,
									uid: cred.user.uid,
									firstName: profile.firstName || "",
									lastName: profile.lastName || "",
									avatar: profile.avatar || "",
									plan: profile.plan || "trial",
									phone: profile.phone || "",
									age: profile.age || "",
									location: profile.location || "",
									blocked: profile.blocked || [],
								};

								// 7. Save to correct storage based on Remember Me
								const target = remember ? localStorage : sessionStorage;
								target.setItem("reh_user", JSON.stringify(session));

								// 8. Success feedback + redirect
								showToast(
									`✨ Welcome back, ${profile.firstName || "Beautiful"}!`,
								);
								
								setTimeout(() => {
									window.location.href = "index?redirect=/dashboard";
								}, 1000);
							} catch (e) {
								console.error("[login] error:", e);
								let msg = "Something went wrong. Please try again.";
								if (e.code === "auth/invalid-email") {
									msg = "Please enter a valid email address.";
								} else if (e.code === "auth/too-many-requests") {
									msg = "Too many attempts. Try again in a few minutes.";
								} else if (e.code === "auth/user-disabled") {
									msg = "This account has been disabled. Contact support.";
								} else if (e.code === "auth/network-request-failed") {
									msg = "Network error. Check your connection.";
								} else if (e.message === "Incorrect email or password.") {
									msg = "Incorrect email or password.";
								}
								showToast("❌ " + msg);
								btn.disabled = false;
								btn.innerHTML = originalHTML;
							}
						});
				}

				// Wait for Firebase, then run the app
				waitForFirebase(startApp);
			})();
		</script>
	</body>
</html>
