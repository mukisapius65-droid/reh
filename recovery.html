<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Reh</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --deep-navy: #080c24;
      --sapphire: #0f1b4a;
      --royal-blue: #162464;
      --crimson: #8b1a2b;
      --ruby: #a82035;
      --rose: #c0394b;
      --gold: #c9a84c;
      --gold-light: #dfc278;
      --champagne: #f0e4c8;
      --pure-white: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f0ece6;
      --text-secondary: #c5bfb3;
      --text-muted: #8a857a;
      --love-pink: #ff6b8a;
      --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; font-size: 16px; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--deep-navy);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
      letter-spacing: 0.01em;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    ::selection { color: var(--champagne); background: rgba(180, 30, 50, 0.5); }

    .bg-orbit { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bg-orbit::before {
      content: '';
      position: absolute;
      top: -30%; left: -20%;
      width: 140%; height: 160%;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(255, 107, 138, 0.1) 0%, transparent 55%),
        radial-gradient(ellipse at 60% 60%, rgba(200, 160, 60, 0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 40% 80%, rgba(20, 40, 120, 0.12) 0%, transparent 55%);
      animation: bgPulse 10s ease-in-out infinite;
    }
    @keyframes bgPulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    .hearts-container { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .floating-heart {
      position: absolute;
      color: var(--love-pink);
      font-size: 1.3rem;
      animation: floatHeart 7s ease-in-out infinite;
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(255, 107, 138, 0.5));
    }
    .floating-heart:nth-child(odd) {
      color: var(--gold-light);
      filter: drop-shadow(0 0 6px rgba(200, 160, 60, 0.5));
    }
    @keyframes floatHeart {
      0% { transform: translateY(105vh) translateX(0) scale(0.4); opacity: 0; }
      10% { opacity: 1; }
      50% { opacity: 0.8; transform: translateY(40vh) translateX(25px) scale(1.1); }
      90% { opacity: 0.2; }
      100% { transform: translateY(-10vh) translateX(-10px) scale(0.3); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      background: rgba(15, 20, 50, 0.55);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 2.5rem 2rem 2rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(200, 155, 60, 0.15);
      text-align: center;
      transition: box-shadow 0.4s;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 32px;
      padding: 2px;
      background: linear-gradient(160deg, rgba(255, 107, 138, 0.4) 0%, rgba(200, 160, 70, 0.3) 40%, rgba(20, 45, 130, 0.3) 70%, rgba(255, 150, 180, 0.4) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.8;
      z-index: 0;
    }
    .card > * { position: relative; z-index: 1; }

    .icon-circle {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--rose), var(--royal-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--gold-light);
      box-shadow: 0 0 30px rgba(255, 107, 138, 0.5);
      animation: iconPulse 2.5s infinite;
    }
    @keyframes iconPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 107, 138, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(255, 107, 138, 0.8); }
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.4rem;
      background: linear-gradient(180deg, #ffffff 0%, #f0d9b0 40%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 1.3rem; text-align: left; }
    .form-group label {
      display: block;
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
      letter-spacing: 0.04em;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      transition: 0.3s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--gold-light);
      box-shadow: 0 0 18px rgba(200, 160, 60, 0.2);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--ruby), var(--love-pink), var(--crimson));
      border: none;
      border-radius: 14px;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.35s var(--transition-smooth);
      box-shadow: 0 8px 25px rgba(255, 107, 138, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      text-decoration: none;
    }
    .btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #ff5e7a, #ff8fa3, #c0394b);
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(255, 107, 138, 0.8);
    }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .step-panel { display: none; animation: fadeSlide 0.4s ease-out; }
    .step-panel.active { display: block; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .email-display { color: var(--gold-light); font-weight: 600; word-break: break-all; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20, 30, 60, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--gold);
      color: var(--champagne);
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 0.85rem;
      z-index: 999;
      transition: transform 0.4s var(--transition-bounce);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.2rem; }
      .title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="bg-orbit"></div>
  <div class="hearts-container" id="heartsContainer"></div>
  <div class="toast" id="toast"><i class="fa-solid fa-heart"></i> <span id="toastMessage"></span></div>

  <div class="card">
    <div class="icon-circle">
      <i class="fa-solid fa-lock-open"></i>
    </div>

    <!-- Panel 1: Enter email -->
    <div class="step-panel active" id="stepEmail">
      <h1 class="title">Forgot Your Password?</h1>
      <p class="subtitle">Enter your email and we'll send you a secure reset link.</p>
      <div class="form-group">
        <label><i class="fa-solid fa-envelope"></i> Email Address</label>
        <input type="email" id="recoveryEmail" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button class="btn" id="sendBtn">
        <i class="fa-solid fa-paper-plane"></i> Send Reset Link
      </button>
    </div>

    <!-- Panel 2: Success -->
    <div class="step-panel" id="stepSuccess">
      <h1 class="title">Check Your Inbox</h1>
      <p class="subtitle">
        If an account exists for <span class="email-display" id="successEmail"></span>, a reset link is on its way.
        The link expires in 1 hour.
      </p>
      <p class="subtitle" style="font-size:0.8rem; margin-top:-1rem;">
        <i class="fa-solid fa-circle-info"></i> Don't see it? Check spam. It comes from Firebase.
      </p>
      <a href="index.html?redirect=login.html" class="btn">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Back to Sign In
      </a>
    </div>

    <div style="margin-top:1.5rem; font-size:0.8rem; color:var(--text-muted);">
      <a href="index.html?redirect=login.html" style="color:var(--gold-light); text-decoration:none; font-weight:600;">
        <i class="fa-solid fa-arrow-left"></i> Back to Sign In
      </a>
    </div>
  </div>

  <script type="module">
    import { auth, sendPasswordResetEmail } from './assets/firebase.js';

    // ─── Floating hearts ────────────────────────────
    const heartsContainer = document.getElementById('heartsContainer');
    const heartIcons = ['❤️', '💕', '💖', '💗', '💘', '✨', '🌸'];
    const goldHearts = ['💛', '⭐', '🌟'];
    function createHeart() {
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.textContent = (Math.random() > 0.7 ? goldHearts : heartIcons)[Math.floor(Math.random() * 6)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDuration = (Math.random() * 8 + 6) + 's';
      heart.style.animationDelay = Math.random() * 5 + 's';
      heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 12000);
    }
    setInterval(createHeart, 400);
    for (let i = 0; i < 10; i++) setTimeout(createHeart, i * 200);

    // ─── Toast ──────────────────────────────────────
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    let toastTimer;
    function showToast(msg) {
      if (toastTimer) clearTimeout(toastTimer);
      toastMessage.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
    }

    // ─── Panel switching ────────────────────────────
    const panelEmail = document.getElementById('stepEmail');
    const panelSuccess = document.getElementById('stepSuccess');
    function showPanel(panel) {
      [panelEmail, panelSuccess].forEach(p => p.classList.remove('active'));
      panel.classList.add('active');
    }

    // ─── Send reset link ────────────────────────────
    const emailInput = document.getElementById('recoveryEmail');
    const sendBtn = document.getElementById('sendBtn');
    const successEmail = document.getElementById('successEmail');

    async function handleSend() {
      const email = emailInput.value.trim().toLowerCase();
      if (!email) {
        showToast('🌸 Please enter your email address.');
        return;
      }

      const orig = sendBtn.innerHTML;
      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending…';

      try {
        await sendPasswordResetEmail(auth, email);
        successEmail.textContent = email;
        showPanel(panelSuccess);
        showToast('📧 Reset link sent. Check your inbox.');
      } catch (err) {
        // Anti-enumeration: show success panel even if user-not-found
        if (err.code === 'auth/user-not-found'
            || err.code === 'auth/invalid-credential') {
          successEmail.textContent = email;
          showPanel(panelSuccess);
          showToast('📧 Reset link sent. Check your inbox.');
        } else if (err.code === 'auth/too-many-requests') {
          showToast('⏳ Too many attempts. Please wait a few minutes and try again.');
        } else if (err.code === 'auth/invalid-email') {
          showToast('❌ Please enter a valid email address.');
        } else if (err.code === 'auth/network-request-failed') {
          showToast('📶 Network error. Check your connection and try again.');
        } else if (err.code === 'auth/operation-not-allowed') {
          showToast('⚠️ Password reset is temporarily unavailable. Contact support.');
        } else {
          console.error('[recovery] unexpected error:', err);
          showToast('❌ Something went wrong. Please try again.');
        }
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = orig;
      }
    }

    sendBtn.addEventListener('click', handleSend);
    emailInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSend();
    });

    // ─── Start ──────────────────────────────────────
    showPanel(panelEmail);
  </script>
</body>
</html>
