<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tar TV | Reh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --deep-navy: #080c24;
            --gold: #c9a84c;
            --gold-light: #dfc278;
            --champagne: #f0e4c8;
            --text: #f0ece6;
            --text-secondary: #c5bfb3;
            --text-muted: #8a857a;
            --glass-bg: rgba(0,0,0,0.4);
            --glass-border: rgba(255,255,255,0.1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--deep-navy); font-family:'Inter',sans-serif; color:var(--text); overflow:hidden; height:100vh; }
        .tv-container { height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; -ms-overflow-style:none; }
        .tv-container::-webkit-scrollbar { display:none; }
        .video-slide { position:relative; height:100vh; scroll-snap-align:start; display:flex; align-items:center; justify-content:center; background:#000; }
        .video-slide video { width:100%; height:100%; object-fit:contain; background:#000; }
        .video-placeholder { position:absolute; inset:0; background-size:cover; background-position:center; filter:blur(10px); }
        .slide-overlay {
            position:absolute;
            bottom:0;
            left:0;
            right:0;
            padding: 1.2rem 1.5rem 2rem;
            background:linear-gradient(transparent, rgba(0,0,0,0.85));
            display:flex;
            flex-direction:column;
            gap:0.3rem;
        }
        /* Seek Bar */
        .seek-container {
            display:flex;
            align-items:center;
            gap:0.8rem;
            margin-bottom:0.6rem;
            padding:0 0.2rem;
        }
        .seek-time {
            font-size:0.7rem;
            color:var(--text-secondary);
            font-variant-numeric:tabular-nums;
            min-width:40px;
            letter-spacing:0.3px;
        }
        .seek-time.duration { text-align:right; }
        .seek-slider {
            flex:1;
            -webkit-appearance:none;
            appearance:none;
            height:3px;
            border-radius:2px;
            background:rgba(255,255,255,0.25);
            outline:none;
            transition:height 0.2s;
            cursor:pointer;
            position:relative;
        }
        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance:none;
            appearance:none;
            width:14px;
            height:14px;
            border-radius:50%;
            background:var(--gold-light);
            border:2px solid rgba(0,0,0,0.6);
            box-shadow:0 0 8px rgba(200,160,60,0.4);
            transition:transform 0.2s;
            cursor:pointer;
        }
        .seek-slider::-webkit-slider-thumb:hover { transform:scale(1.15); }
        .seek-slider::-moz-range-thumb {
            width:14px;
            height:14px;
            border-radius:50%;
            background:var(--gold-light);
            border:2px solid rgba(0,0,0,0.6);
            cursor:pointer;
        }
        .seek-slider:focus { outline:none; }

        .video-title { font-size:1.2rem; font-weight:600; color:white; text-shadow:0 1px 2px rgba(0,0,0,0.8); }
        .video-author { color:var(--gold-light); font-size:0.9rem; }
        .action-buttons {
            position:absolute;
            right:1.5rem;
            bottom:8rem;
            display:flex;
            flex-direction:column;
            gap:1.2rem;
            align-items:center;
        }
        .action-btn {
            background:rgba(0,0,0,0.5);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:50%;
            width:50px;
            height:50px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            color:white;
            font-size:1.2rem;
            transition:0.3s;
            gap:0.2rem;
        }
        .action-btn:hover { background:rgba(200,160,60,0.4); border-color:var(--gold-light); transform:scale(1.1); }
        .action-btn .count-label {
            font-size:0.6rem;
            font-weight:400;
            letter-spacing:0.3px;
            opacity:0.9;
        }
        .loading-spinner { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--gold-light); font-size:2rem; z-index:999; }
        #tar-tv-error {
            position:fixed;
            bottom:80px;
            left:10px;
            right:10px;
            background:rgba(0,0,0,0.85);
            color:#ff6b6b;
            padding:1rem;
            border-radius:8px;
            z-index:9999;
            font-size:0.9rem;
            border:1px solid #ff6b6b;
            display:none;
        }
    </style>
</head>
<body>
    <div id="tar-tv-error"></div>
    <div class="loading-spinner" id="loader"><i class="fa-solid fa-spinner fa-spin"></i></div>
    <div class="tv-container" id="tvContainer"></div>

    <!-- Firebase Compat (non-module) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        (function() {
            // ─── Error Display ──────────────────────────────────────
            const errorDiv = document.getElementById('tar-tv-error');
            function showError(msg) {
                errorDiv.textContent = '❌ ' + msg;
                errorDiv.style.display = 'block';
                document.getElementById('loader').style.display = 'none';
                console.error(msg);
            }

            // ─── Firebase Config ────────────────────────────────────
            const firebaseConfig = {
                apiKey: "AIzaSyClJ9Mlln04N_7XFSvy1zGHaE6w5E2DQ8I",
                authDomain: "rehp-c82b8.firebaseapp.com",
                projectId: "rehp-c82b8",
                storageBucket: "rehp-c82b8.firebasestorage.app",
                messagingSenderId: "363083908702",
                appId: "1:363083908702:web:33e7d66890c9ef79fb96cf",
                measurementId: "G-KX9ZEBL3E1"
            };

            try {
                firebase.initializeApp(firebaseConfig);
            } catch (e) {
                showError('Firebase init error: ' + e.message);
                return;
            }

            const db = firebase.firestore();
            const FieldValue = firebase.firestore.FieldValue;

            // ─── Session View Tracking ─────────────────────────────
            const VIEWED_KEY = 'tar_tv_viewed_videos';
            function loadViewedSet() {
                const stored = sessionStorage.getItem(VIEWED_KEY);
                if (stored) {
                    try { return new Set(JSON.parse(stored)); }
                    catch(e) { return new Set(); }
                }
                return new Set();
            }
            function saveViewedSet(set) {
                sessionStorage.setItem(VIEWED_KEY, JSON.stringify([...set]));
            }
            let viewedSet = loadViewedSet();

            // ─── Main Execution ─────────────────────────────────────
            (async function init() {
                const tvContainer = document.getElementById('tvContainer');
                const loader = document.getElementById('loader');

                try {
                    // Fetch videos
                    const snapshot = await db.collection("tar_tv_videos")
                        .orderBy("createdAt", "desc")
                        .get();

                    loader.style.display = 'none';

                    if (snapshot.empty) {
                        tvContainer.innerHTML = '<div style="text-align:center;margin-top:40vh;color:var(--text-muted);">No videos yet</div>';
                        return;
                    }

                    const videos = [];
                    snapshot.forEach(doc => {
                        videos.push({ id: doc.id, ...doc.data() });
                    });

                    let activeVideo = null;

                    // ─── Intersection Observer ─────────────────────
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            const slide = entry.target;
                            const video = slide.querySelector('video');
                            const videoId = slide.dataset.videoId;
                            const viewsElement = slide.querySelector('.view-count');

                            if (entry.isIntersecting) {
                                if (activeVideo && activeVideo !== video) {
                                    activeVideo.pause();
                                }
                                if (video) {
                                    if (!video.src) video.src = video.dataset.src;
                                    video.muted = isMuted;
                                    video.play().catch(e => console.log(e));
                                }
                                activeVideo = video;

                                // View counting (once per session)
                                if (videoId && !viewedSet.has(videoId)) {
                                    const docRef = db.collection("tar_tv_videos").doc(videoId);
                                    docRef.update({
                                        views: FieldValue.increment(1)
                                    }).then(() => {
                                        const currentCount = parseInt(viewsElement?.textContent || '0', 10);
                                        if (viewsElement) viewsElement.textContent = currentCount + 1;
                                    }).catch(err => {
                                        console.error('Failed to increment views:', err);
                                    });
                                    viewedSet.add(videoId);
                                    saveViewedSet(viewedSet);
                                }
                            } else {
                                if (video) video.pause();
                            }
                        });
                    }, { threshold: 0.5 });

                    // ─── Helpers ────────────────────────────────────
                    function formatTime(seconds) {
                        if (!seconds || isNaN(seconds)) return '0:00';
                        const hrs = Math.floor(seconds / 3600);
                        const mins = Math.floor((seconds % 3600) / 60);
                        const secs = Math.floor(seconds % 60);
                        if (hrs > 0) {
                            return hrs + ':' + (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
                        }
                        return mins + ':' + (secs < 10 ? '0' : '') + secs;
                    }

                    let isMuted = true; // global mute state

                    // ─── Build Slides ──────────────────────────────
                    videos.forEach((v) => {
                        const slide = document.createElement('div');
                        slide.className = 'video-slide';
                        slide.dataset.videoId = v.id;

                        const views = v.views || 0;
                        const likes = v.likes || 0;

                        slide.innerHTML = `
                            <div class="video-placeholder" style="background-image:url('${v.thumbnail || ''}')"></div>
                            <video data-src="${v.videoUrl}" muted loop playsinline preload="metadata"></video>
                            <div class="slide-overlay">
                                <div class="seek-container">
                                    <span class="seek-time current">0:00</span>
                                    <input type="range" class="seek-slider" min="0" max="1" step="0.001" value="0" />
                                    <span class="seek-time duration">0:00</span>
                                </div>
                                <div class="video-title">${v.title}</div>
                                <div class="video-author">@${v.author || 'Reh'}</div>
                            </div>
                            <div class="action-buttons">
                                <div class="action-btn like-btn" data-id="${v.id}">
                                    <i class="fa-solid fa-heart"></i>
                                    <span class="count-label like-count">${likes}</span>
                                </div>
                                <div class="action-btn" style="pointer-events:none;">
                                    <i class="fa-solid fa-eye"></i>
                                    <span class="count-label view-count">${views}</span>
                                </div>
                                <div class="action-btn sound-btn"><i class="fa-solid fa-volume-mute"></i></div>
                                <div class="action-btn"><i class="fa-solid fa-share"></i></div>
                            </div>
                        `;
                        tvContainer.appendChild(slide);

                        const video = slide.querySelector('video');
                        const seekSlider = slide.querySelector('.seek-slider');
                        const currentTimeLabel = slide.querySelector('.seek-time.current');
                        const durationLabel = slide.querySelector('.seek-time.duration');

                        // Seek bar updates
                        video.addEventListener('timeupdate', () => {
                            if (video.duration && !isNaN(video.duration)) {
                                const progress = video.currentTime / video.duration;
                                seekSlider.value = progress;
                                currentTimeLabel.textContent = formatTime(video.currentTime);
                                const percent = progress * 100;
                                seekSlider.style.background = `linear-gradient(to right, var(--gold-light) ${percent}%, rgba(255,255,255,0.25) ${percent}%)`;
                            }
                        });

                        video.addEventListener('loadedmetadata', () => {
                            if (video.duration) {
                                durationLabel.textContent = formatTime(video.duration);
                            }
                        });

                        seekSlider.addEventListener('input', (e) => {
                            if (video.duration && !isNaN(video.duration)) {
                                const newTime = parseFloat(e.target.value) * video.duration;
                                video.currentTime = newTime;
                                currentTimeLabel.textContent = formatTime(newTime);
                                const percent = parseFloat(e.target.value) * 100;
                                seekSlider.style.background = `linear-gradient(to right, var(--gold-light) ${percent}%, rgba(255,255,255,0.25) ${percent}%)`;
                            }
                        });

                        observer.observe(slide);
                    });

                    // ─── Sound Toggle ───────────────────────────────
                    document.querySelectorAll('.sound-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            isMuted = !isMuted;
                            if (activeVideo) {
                                activeVideo.muted = isMuted;
                                const icon = btn.querySelector('i');
                                if (isMuted) {
                                    icon.className = 'fa-solid fa-volume-mute';
                                } else {
                                    icon.className = 'fa-solid fa-volume-up';
                                }
                            }
                        });
                    });

                    // ─── Like Button ─────────────────────────────────
                    document.querySelectorAll('.like-btn').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const id = btn.dataset.id;
                            const docRef = db.collection("tar_tv_videos").doc(id);
                            try {
                                await docRef.update({
                                    likes: FieldValue.increment(1)
                                });
                                const snap = await docRef.get();
                                const newLikes = snap.data().likes || 0;
                                btn.querySelector('.like-count').textContent = newLikes;
                            } catch (err) {
                                console.error('Like error:', err);
                                showError('Like failed: ' + err.message);
                            }
                        });
                    });

                } catch (error) {
                    console.error('Tar TV error:', error);
                    showError('Error: ' + error.message);
                    loader.style.display = 'none';
                    tvContainer.innerHTML = '';
                }
            })();

        })();
    </script>
</body>
</html>
