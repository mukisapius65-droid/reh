<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading | Reh</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    

    <style>
        :root {
            --deep-navy: #080c24;
            --gold: #c9a84c;
            --gold-light: #dfc278;
            --champagne: #f0e4c8;
            --ruby: #a82035;
            --rose: #c0394b;
            --royal-blue: #162464;
            --crimson: #8b1a2b;
            --pure-white: #ffffff;
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--deep-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ── Animated Background ─────────────────── */
        .bg-orbit {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-orbit::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -20%;
            width: 140%;
            height: 160%;
            background:
                radial-gradient(ellipse at 30% 30%, rgba(255, 107, 138, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(200, 160, 60, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(20, 40, 120, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(180, 30, 50, 0.2) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        @keyframes bgPulse {
            0%,
            100% {
                opacity: 0.9;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.03);
            }
        }

        /* ── Floating Particles ─────────────────── */
        .particles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
            pointer-events: none;
        }
        .particle.diamond {
            border-radius: 2px;
            transform: rotate(45deg);
        }
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            40% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-15vh) scale(1.4) rotate(180deg);
                opacity: 0;
            }
        }

        /* ── Loading Container ──────────────────── */
        .loader {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* ── Shimmering Gem ─────────────────────── */
        .gem-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gem-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--rose), var(--royal-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: var(--gold-light);
            box-shadow: 0 0 50px rgba(200, 50, 65, 0.6), 0 0 100px rgba(200, 160, 60, 0.3);
            position: relative;
            overflow: hidden;
            animation: gemPulse 2.2s ease-in-out infinite;
        }

        /* Shimmer moving across */
        .gem-icon::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                    transparent 40%,
                    rgba(255, 255, 255, 0.5) 50%,
                    transparent 60%);
            transform: rotate(30deg);
            animation: shimmer 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(30deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(30deg);
            }
        }

        @keyframes gemPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 50px rgba(200, 50, 65, 0.6), 0 0 100px rgba(200, 160, 60, 0.3);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 70px rgba(200, 50, 65, 0.9), 0 0 130px rgba(200, 160, 60, 0.5);
            }
        }

        /* ── Title ──────────────────────────────── */
        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(180deg, #ffffff 0%, #f0d9b0 40%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 6px rgba(200, 150, 50, 0.4));
            animation: fadeInUp 0.8s ease-out;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-style: italic;
            color: var(--champagne);
            opacity: 0.8;
            letter-spacing: 0.03em;
            animation: fadeInUp 1s ease-out;
        }

        /* ── Progress Ring ──────────────────────── */
        .progress-ring {
            position: relative;
            width: 50px;
            height: 50px;
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.2s ease;
        }

        .progress-ring .bg {
            stroke: rgba(255, 255, 255, 0.15);
        }

        .progress-ring .fill {
            stroke: var(--gold-light);
            stroke-dasharray: 138.2;
            stroke-dashoffset: 138.2;
            filter: drop-shadow(0 0 6px rgba(200, 160, 60, 0.5));
            animation: progressFill 2.5s ease-in-out forwards;
        }

        @keyframes progressFill {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Responsive ──────────────────────────── */
        @media (max-width: 480px) {
            .gem-icon {
                width: 70px;
                height: 70px;
                font-size: 2.2rem;
            }
            .brand-name {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orbit"></div>
    <div class="particles-container" id="particlesContainer"></div>

    <div class="loader">
        <div class="gem-wrapper">
            <div class="gem-icon">
                <i class="fa-solid fa-gem"></i>
            </div>
        </div>

        <div>
            <h1 class="brand-name">Reh</h1>
            <p class="tagline">Where extraordinary hearts find home</p>
        </div>

        <!-- SVG Progress Ring -->
        <svg class="progress-ring" viewBox="0 0 50 50">
            <circle class="bg" cx="25" cy="25" r="22" />
            <circle class="fill" cx="25" cy="25" r="22" />
        </svg>
    </div>

    <script>
        (function() {
            // ── Floating particles ──────────────────
            const particlesContainer = document.getElementById('particlesContainer');
            const colors = [
                'rgba(200,160,60,0.6)',
                'rgba(220,180,70,0.5)',
                'rgba(180,35,50,0.5)',
                'rgba(30,55,150,0.5)',
                'rgba(255,107,138,0.5)',
                'rgba(255,255,255,0.4)'
            ];
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'particle' + (Math.random() > 0.6 ? ' diamond' : '');
                p.style.width = (Math.random() * 7 + 2) + 'px';
                p.style.height = p.style.width;
                p.style.left = Math.random() * 100 + '%';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = (Math.random() * 18 + 10) + 's';
                p.style.animationDelay = (Math.random() * 15) + 's';
                if (p.classList.contains('diamond')) {
                    p.style.backgroundColor = 'transparent';
                    p.style.border = '1px solid ' + colors[Math.floor(Math.random() * colors.length)];
                }
                particlesContainer.appendChild(p);
            }

            // ── Redirect after animation ────────────
            // After 2.5 seconds, go to the main page (or any target)
            // You can change the redirect URL as needed.
            setTimeout(() => {
                // Get possible redirect parameter from URL (?redirect=discover.html)
                const urlParams = new URLSearchParams(window.location.search);
                const redirectTo = urlParams.get('redirect') || 'discover.html';
                window.location.href = redirectTo;
            }, 2600);
        })();
    </script>
</body>
</html>
