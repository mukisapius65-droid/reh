<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reh — Where Extraordinary Hearts Find Home</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --deep-navy: #080c24;
            --gold: #c9a84c;
            --gold-light: #dfc278;
            --champagne: #f0e4c8;
            --crimson: #8b1a2b;
            --ruby: #a82035;
            --royal-blue: #162464;
            --pure-white: #ffffff;
            --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: var(--deep-navy);
            color: var(--pure-white);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ── Animated background ─────────────────── */
        .bg-orbit {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orbit::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -20%;
            width: 140%;
            height: 160%;
            background:
                radial-gradient(ellipse at 30% 30%, rgba(255, 107, 138, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(200, 160, 60, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(20, 40, 120, 0.2) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        @keyframes bgPulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }

        /* ── Floating gems & hearts ──────────────── */
        .particles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .floating-element {
            position: absolute;
            font-size: 1.4rem;
            animation: floatUp linear infinite;
            opacity: 0;
            filter: drop-shadow(0 0 8px rgba(200, 160, 60, 0.5));
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) translateX(0) scale(0.5); opacity: 0; }
            5% { opacity: 1; }
            60% { opacity: 0.8; }
            100% { transform: translateY(-10vh) translateX(30px) scale(1.1); opacity: 0; }
        }

        /* ── Main card ───────────────────────────── */
        .landing-card {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            animation: fadeSlideIn 0.8s var(--transition-bounce);
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gem-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
        }
        .gem-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--ruby), var(--royal-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            color: var(--gold-light);
            box-shadow: 0 0 60px rgba(200, 50, 65, 0.6), 0 0 120px rgba(200, 160, 60, 0.3);
            position: relative;
            overflow: hidden;
            animation: gemPulse 2.5s ease-in-out infinite;
        }
        .gem-icon::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
            transform: rotate(30deg);
            animation: shimmer 2.2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(30deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(30deg); }
        }
        @keyframes gemPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(200,50,65,0.6), 0 0 120px rgba(200,160,60,0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 80px rgba(200,50,65,0.9), 0 0 150px rgba(200,160,60,0.5); }
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 8vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(180deg, #ffffff 0%, #f0d9b0 40%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 10px rgba(200, 155, 50, 0.4));
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            font-style: italic;
            color: var(--champagne);
            opacity: 0.9;
            margin-bottom: 2.5rem;
            letter-spacing: 0.03em;
        }

        .btn-group {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 2.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.35s var(--transition-smooth);
            text-decoration: none;
            border: none;
        }

        .btn-join {
            background: linear-gradient(135deg, var(--crimson), var(--ruby));
            color: white;
            box-shadow: 0 8px 25px rgba(180, 30, 45, 0.4);
        }
        .btn-join:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(200, 40, 55, 0.6);
        }

        .btn-signin {
            background: transparent;
            border: 1px solid var(--gold-light);
            color: var(--gold-light);
        }
        .btn-signin:hover {
            background: rgba(200, 160, 60, 0.1);
            border-color: var(--gold);
            color: var(--champagne);
        }

        /* ── Footer link ─────────────────────────── */
        .footer-link {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 2;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .footer-link a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 500;
        }
        .footer-link a:hover {
            color: var(--champagne);
        }

        @media (max-width: 480px) {
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 80%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orbit"></div>
    <div class="particles-container" id="particlesContainer"></div>

    <div class="landing-card">
        <div class="gem-wrapper">
            <div class="gem-icon">
                <i class="fa-solid fa-gem"></i>
            </div>
        </div>
        <h1 class="brand-name">Reh</h1>
        <p class="tagline">Where Extraordinary Hearts Find Home</p>
        <div class="btn-group">
            <a href="register.html" class="btn btn-join"><i class="fa-solid fa-heart-circle-plus"></i> Join the Circle</a>
            <a href="login.html" class="btn btn-signin"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</a>
        </div>
    </div>

    <div class="footer-link">
        <a href="the-iron-convenant.html">Privacy Policy</a> · 
        <a href="terms.html">Terms of Service</a>
    </div>

    <script>
        (function() {
            // ── Floating elements (hearts, gems, sparkles) ──
            const container = document.getElementById('particlesContainer');
            const icons = ['❤️', '💎', '✨', '💖', '💛', '💕', '🌟', '💗'];
            function spawn() {
                const el = document.createElement('span');
                el.className = 'floating-element';
                el.textContent = icons[Math.floor(Math.random() * icons.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.animationDuration = (Math.random() * 10 + 8) + 's';
                container.appendChild(el);
                setTimeout(() => el.remove(), 12000);
            }
            setInterval(spawn, 600);
            for (let i = 0; i < 8; i++) setTimeout(spawn, i * 300);
        })();
    </script>
</body>
</html>
