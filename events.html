    <style>
      :root {
        --deep-navy: #080c24;
        --sapphire: #0f1b4a;
        --royal-blue: #162464;
        --crimson: #8b1a2b;
        --ruby: #a82035;
        --rose: #c0394b;
        --gold: #c9a84c;
        --gold-light: #dfc278;
        --champagne: #f0e4c8;
        --cream: #faf7f0;
        --pure-white: #ffffff;
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-bg-card: rgba(15, 20, 50, 0.55);
        --card-border-glow: rgba(200, 160, 70, 0.25);
        --text-primary: #f0ece6;
        --text-secondary: #c5bfb3;
        --text-muted: #8a857a;
        --shadow-gold: 0 0 40px rgba(200, 155, 60, 0.15);
        --shadow-crimson: 0 0 30px rgba(180, 30, 50, 0.2);
        --shadow-sapphire: 0 0 35px rgba(30, 50, 140, 0.25);
        --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--deep-navy);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.6;
        letter-spacing: 0.01em;
        position: relative;
        -webkit-tap-highlight-color: transparent;
      }

      ::selection {
        color: var(--champagne);
        background: rgba(180, 30, 50, 0.4);
      }

      /* ── Animated Background ─────────────────────── */
      .bg-orbit {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .bg-orbit::before {
        content: "";
        position: absolute;
        top: -30%;
        left: -20%;
        width: 140%;
        height: 160%;
        background:
          radial-gradient(
            ellipse at 28% 22%,
            rgba(25, 40, 120, 0.35) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 72% 65%,
            rgba(160, 25, 40, 0.28) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 50% 50%,
            rgba(200, 160, 60, 0.06) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse at 85% 15%,
            rgba(20, 35, 100, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 15% 80%,
            rgba(140, 20, 35, 0.22) 0%,
            transparent 50%
          );
        animation: bgPulse 12s ease-in-out infinite;
      }
      @keyframes bgPulse {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(1) rotate(0deg);
        }
        33% {
          opacity: 1;
          transform: scale(1.04) rotate(0.3deg);
        }
        66% {
          opacity: 0.9;
          transform: scale(0.97) rotate(-0.2deg);
        }
      }

      /* ── Floating Particles ─────────────────────── */
      .particles-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        animation: floatUp linear infinite;
        opacity: 0;
      }
      .particle.diamond {
        border-radius: 2px;
        transform: rotate(45deg);
      }
      @keyframes floatUp {
        0% {
          transform: translateY(105vh) scale(0) rotate(0deg);
          opacity: 0;
        }
        5% {
          opacity: 1;
        }
        40% {
          opacity: 0.7;
        }
        90% {
          opacity: 0.1;
        }
        100% {
          transform: translateY(-15vh) scale(1.4) rotate(180deg);
          opacity: 0;
        }
      }

      /* ── Main Wrapper ──────────────────────────── */
      .main-wrapper {
        position: relative;
        z-index: 2;
      }

      /* ── Navigation ────────────────────────────── */
      .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(8, 12, 36, 0.7);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border-bottom: 1px solid var(--glass-border);
        padding: 0 2rem;
      }
      .nav-inner {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 70px;
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--text-primary);
      }
      .nav-brand-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--crimson), var(--royal-blue));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        color: var(--gold-light);
        box-shadow: 0 0 25px rgba(180, 40, 55, 0.4);
        animation: iconGlow 3s ease-in-out infinite;
      }
      @keyframes iconGlow {
        0%,
        100% {
          box-shadow:
            0 0 25px rgba(180, 40, 55, 0.4),
            0 0 50px rgba(20, 40, 120, 0.2);
        }
        50% {
          box-shadow:
            0 0 40px rgba(200, 50, 65, 0.6),
            0 0 70px rgba(25, 50, 140, 0.35);
        }
      }
      .nav-brand-text {
        font-family: "Playfair Display", serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        background: linear-gradient(
          135deg,
          var(--gold-light),
          var(--champagne),
          var(--gold)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 2rem;
        list-style: none;
      }
      .nav-links a {
        text-decoration: none;
        color: var(--text-secondary);
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        transition: color 0.3s;
        position: relative;
      }
      .nav-links a::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--gold);
        transition: width 0.35s var(--transition-smooth);
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: var(--champagne);
      }
      .nav-links a.active::after {
        width: 100%;
      }
      .nav-links a:hover::after {
        width: 100%;
      }
      /* Notification Bell */
      .notification-bell {
        position: relative;
        cursor: pointer;
        margin-right: 1rem;
        font-size: 1.3rem;
        color: var(--text-secondary);
        transition: color 0.3s;
      }
      .notification-bell:hover {
        color: var(--champagne);
      }
      .notification-bell .badge {
        position: absolute;
        top: -6px;
        right: -10px;
        background: var(--ruby);
        color: white;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        font-size: 0.65rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        box-shadow: 0 0 8px rgba(180, 30, 45, 0.6);
      }
      .notif-dropdown {
        position: absolute;
        top: 40px;
        right: 0;
        width: 320px;
        max-height: 400px;
        overflow-y: scroll;
        background: rgba(15, 20, 50, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid var(--gold);
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        padding: 1rem;
        display: none;
        z-index: 300;
      }
      .notif-dropdown::-webkit-scrollbar {
        width: 2px;
        background-color: pink;
        border-radius: 10px;
      }
      .notif-dropdown::-webkit-scrollbar-thumb {
        width: 3px;
        background-color: rgba(15, 20, 50, 0.95);
      }
      .notif-dropdown::-webkit-scrollbar-track {
        background-color: gold;
      }
      .notif-dropdown.show {
        display: block;
      }
      .notif-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.8rem;
      }
      .notif-header h4 {
        color: var(--gold-light);
        font-family: "Playfair Display", serif;
        font-size: 1rem;
      }
      .notif-header button {
        background: none;
        border: 1px solid var(--glass-border);
        color: var(--text-secondary);
        padding: 4px 10px;
        border-radius: 15px;
        font-size: 0.7rem;
        cursor: pointer;
        transition: 0.2s;
      }
      .notif-header button:hover {
        border-color: var(--gold);
        color: var(--champagne);
      }
      .notif-item {
        padding: 0.6rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.8rem;
        color: var(--text-secondary);
      }
      .notif-item:last-child {
        border-bottom: none;
      }
      .notif-item .notif-title {
        color: var(--champagne);
        font-weight: 600;
        margin-bottom: 0.2rem;
      }
      .notif-item .notif-time {
        font-size: 0.65rem;
        color: var(--text-muted);
        margin-top: 0.2rem;
      }
      .notif-item .mark-read {
        background: none;
        border: none;
        color: var(--gold-light);
        cursor: pointer;
        font-size: 0.7rem;
        margin-left: 0.5rem;
      }
      .nav-cta {
        background: linear-gradient(135deg, var(--crimson), var(--ruby));
        color: var(--pure-white);
        border: none;
        padding: 10px 26px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: all 0.35s var(--transition-smooth);
        box-shadow: 0 4px 20px rgba(180, 30, 45, 0.35);
        white-space: nowrap;
      }
      .nav-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(200, 40, 55, 0.5);
        background: linear-gradient(135deg, #a01e30, #c03040);
      }
      /* ── Logged‑in Avatar & Dropdown ─────────── */
      .nav-profile {
        position: relative;
        cursor: pointer;
      }
      .nav-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 2px solid var(--gold-light);
        box-shadow: 0 0 20px rgba(200, 160, 60, 0.4);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s;
        background: #1a1e35;
      }
      .nav-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .nav-avatar:hover {
        box-shadow: 0 0 30px rgba(200, 160, 60, 0.8);
        transform: scale(1.05);
      }
      .dropdown-menu {
        position: absolute;
        top: 55px;
        right: 0;
        background: rgba(15, 20, 50, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--gold);
        border-radius: 16px;
        padding: 0.8rem;
        width: 180px;
        display: none;
        flex-direction: column;
        gap: 0.5rem;
        z-index: 200;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      }
      .dropdown-menu.show {
        display: flex;
      }
      .dropdown-menu a,
      .dropdown-menu button {
        background: none;
        border: none;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.85rem;
        padding: 8px 12px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: 0.2s;
        text-align: left;
        width: 100%;
      }
      .dropdown-menu a:hover,
      .dropdown-menu button:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--champagne);
      }
      .nav-hamburger {
        display: none;
        background: none;
        border: none;
        color: var(--text-primary);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 8px;
      }

      /* ── Events Hero ───────────────────────────── */
      .events-hero {
        max-width: 1400px;
        margin: 0 auto;
        padding: 3.5rem 2rem 2rem;
        text-align: center;
        animation: fadeInUp 0.9s var(--transition-smooth);
      }
      .events-badge {
        display: inline-block;
        background: rgba(200, 160, 60, 0.12);
        border: 1px solid var(--gold);
        color: var(--gold-light);
        padding: 10px 28px;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
        backdrop-filter: blur(10px);
      }
      .events-title {
        font-family: "Playfair Display", serif;
        font-size: clamp(2.8rem, 5vw, 4.2rem);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: 0.02em;
        margin-bottom: 1rem;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #e8dfd0 40%,
          #c9a84c 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 2px 8px rgba(200, 155, 50, 0.3));
      }
      .events-subtitle {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(1rem, 1.8vw, 1.3rem);
        font-weight: 400;
        font-style: italic;
        color: var(--text-secondary);
        max-width: 650px;
        margin: 0 auto 2rem;
        letter-spacing: 0.03em;
      }

      /* ── Filters ────────────────────────────────── */
      .filter-section {
        max-width: 1200px;
        margin: 1rem auto 2rem;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0 1rem;
        animation: fadeInUp 1s var(--transition-smooth);
      }
      .filter-chip {
        padding: 10px 22px;
        border-radius: 50px;
        border: 1px solid var(--glass-border);
        background: var(--glass-bg);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        transition: all 0.35s var(--transition-smooth);
        backdrop-filter: blur(8px);
        white-space: nowrap;
      }
      .filter-chip:hover,
      .filter-chip.active {
        background: rgba(180, 30, 45, 0.3);
        border-color: rgba(200, 150, 60, 0.5);
        color: var(--champagne);
        box-shadow: 0 0 25px rgba(180, 35, 50, 0.3);
        transform: translateY(-2px);
      }
      .filter-chip.active {
        background: linear-gradient(
          135deg,
          rgba(160, 25, 40, 0.5),
          rgba(20, 40, 110, 0.4)
        );
        border-color: var(--gold);
        color: var(--pure-white);
        font-weight: 600;
      }

      /* ── Event Grid ────────────────────────────── */
      .events-grid {
        max-width: 1400px;
        margin: 0 auto 4rem;
        padding: 0 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 2rem;
      }
      .event-card {
        position: relative;
        border-radius: 24px;
        overflow: hidden;
        background: var(--glass-bg-card);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        transition: all 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
        opacity: 0;
        transform: translateY(60px) scale(0.92);
        will-change: transform, opacity;
      }
      .event-card.card-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .event-card:hover {
        transform: translateY(-10px) scale(1.025);
        border-color: var(--card-border-glow);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.5),
          var(--shadow-gold);
      }
      .event-card::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 24px;
        padding: 1.5px;
        background: linear-gradient(
          160deg,
          rgba(220, 180, 70, 0.6) 0%,
          rgba(200, 40, 55, 0.3) 30%,
          rgba(20, 45, 130, 0.3) 60%,
          rgba(200, 160, 70, 0.4) 100%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        opacity: 0.7;
        z-index: 1;
      }
      .event-card:hover::before {
        opacity: 1;
      }

      .event-img-panel {
        position: relative;
        width: 100%;
        height: 220px;
        background-size: cover;
        background-position: center;
        overflow: hidden;
        z-index: 2;
      }
      .event-img-fallback {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #1a2040, #2a1a30);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold-light);
        font-size: 2.8rem;
        opacity: 0.8;
      }
      .event-type-badge {
        position: absolute;
        top: 14px;
        left: 14px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(12px);
        color: var(--gold-light);
        padding: 5px 14px;
        border-radius: 50px;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        z-index: 5;
        border: 1px solid rgba(200, 160, 60, 0.4);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .event-card-body {
        padding: 1.4rem;
        position: relative;
        z-index: 2;
      }
      .event-date {
        font-size: 0.8rem;
        color: var(--gold-light);
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 0.3rem;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .event-name {
        font-family: "Playfair Display", serif;
        font-size: 1.4rem;
        font-weight: 600;
        color: var(--pure-white);
        margin-bottom: 0.6rem;
        line-height: 1.2;
      }
      .event-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 0.78rem;
        color: var(--text-secondary);
        margin-bottom: 0.6rem;
      }
      .event-meta span {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .dress-code {
        background: rgba(200, 160, 60, 0.08);
        border: 1px solid rgba(200, 160, 60, 0.25);
        padding: 6px 14px;
        border-radius: 50px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.73rem;
        color: var(--champagne);
        font-weight: 500;
        margin: 0.5rem 0;
      }
      .event-desc {
        font-size: 0.82rem;
        color: var(--text-muted);
        margin: 0.6rem 0 1rem;
        line-height: 1.5;
      }
      .btn-request {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, var(--crimson), var(--royal-blue));
        border: none;
        border-radius: 12px;
        color: white;
        font-weight: 600;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 20px rgba(180, 30, 45, 0.3);
      }
      .btn-request:hover {
        background: linear-gradient(135deg, #a01e30, #1a3a80);
        box-shadow: 0 8px 30px rgba(200, 40, 55, 0.5);
        transform: translateY(-2px);
      }

      /* ── Footer ────────────────────────────────── */
      .footer {
        text-align: center;
        padding: 2.5rem 2rem;
        border-top: 1px solid var(--glass-border);
        color: var(--text-muted);
        font-size: 0.78rem;
        letter-spacing: 0.04em;
      }
      .footer span {
        color: var(--gold-light);
        font-weight: 600;
      }

      /* ── Toast ─────────────────────────────────── */
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: rgba(20, 30, 60, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid var(--gold);
        color: var(--champagne);
        padding: 14px 28px;
        border-radius: 50px;
        font-size: 0.85rem;
        z-index: 999;
        transition: transform 0.4s var(--transition-bounce);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }

      /* ── Animations ────────────────────────────── */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Responsive ────────────────────────────── */
      @media (max-width: 768px) {
        .nav-links {
          display: none;
        }
        .nav-hamburger {
          display: block;
        }
        .events-grid {
          grid-template-columns: 1fr;
          gap: 1.4rem;
        }
        .event-img-panel {
          height: 180px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-orbit"></div>
    <div class="particles-container" id="particlesContainer"></div>
    <div class="toast" id="toast"></div>

    <div class="main-wrapper">
      <!-- Navigation -->
      <nav class="nav"></nav>

      <!-- Sidebar -->
      <aside class="sidebar invisible" id="sidebar"></aside>

      <!-- Hero -->
      <section class="events-hero">
        <div class="events-badge">
          <i class="fa-regular fa-calendar-check"></i> The Social Calendar
        </div>
        <h1 class="events-title">Exclusive Events</h1>
        <p class="events-subtitle">
          From moonlit yacht parties to private concerts in palazzos — every
          gathering is an invitation to a world where luxury and romance
          intertwine.
        </p>
      </section>

      <!-- Filters -->
      <div class="filter-section">
        <button class="filter-chip active" data-type="all">All Events</button>
        <button class="filter-chip" data-type="gala">Galas</button>
        <button class="filter-chip" data-type="yacht">Yacht Parties</button>
        <button class="filter-chip" data-type="polo">
          Polo &amp; Equestrian
        </button>
        <button class="filter-chip" data-type="wine">Wine &amp; Dine</button>
        <button class="filter-chip" data-type="concert">
          Private Concerts
        </button>
      </div>

      <!-- Events Grid -->
      <div class="events-grid" id="eventsGrid"></div>

      <footer class="footer"></footer>
    </div>

    <script src="assets/general.js"></script>
    <script src="assets/auth.js"></script>
    <script>
      (function () {
        // ── Firebase readiness helper ──────────────
        function waitForFirebase(callback) {
          if (
            window.db &&
            window.collection &&
            window.getDocs &&
            window.query &&
            window.where &&
            window.orderBy &&
            window.limit &&
            window.addDoc &&
            window.updateDoc &&
            window.deleteDoc &&
            window.serverTimestamp
          ) {
            callback();
          } else {
            let attempts = 0;
            const check = setInterval(() => {
              if (
                window.db &&
                window.collection &&
                window.getDocs &&
                window.query &&
                window.where &&
                window.orderBy &&
                window.limit &&
                window.addDoc &&
                window.updateDoc &&
                window.deleteDoc &&
                window.serverTimestamp
              ) {
                clearInterval(check);
                callback();
              }
              attempts++;
              if (attempts > 50) {
                clearInterval(check);
                console.error("Firebase not ready for Events");
              }
            }, 100);
          }
        }

        function startApp() {
          // ── Toast ────────────────────────────────
          const toast = document.getElementById("toast");
          let toastTimer;
          function showToast(msg) {
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.classList.add("show");
            toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
          }

          // ── DOM refs ─────────────────────────────
          const eventsGrid = document.getElementById("eventsGrid");
          const filterChips = document.querySelectorAll(".filter-chip");
          let activeFilter = "all";

          // ── Plan eligibility (from general.js) ────
          function isEligible(minimumPlan) {
            const user = JSON.parse(localStorage.getItem("reh_user") || "{}");
            const plan = user.plan || "trial";
            const planLevels = {
              trial: 0,
              "premium-monthly": 1,
              "elite-annual": 2,
            };
            return (planLevels[plan] || 0) >= (planLevels[minimumPlan] || 0);
          }

          // ── Firestore: fetch all events ───────────
          async function getEvents() {
            const q = window.query(
              window.collection(window.db, "events"),
              window.orderBy("date"), // optional: order by date string; you could also use a real timestamp field
            );
            const snapshot = await window.getDocs(q);
            const events = [];
            snapshot.forEach((doc) => {
              events.push({ id: doc.id, ...doc.data() });
            });
            // If no events exist, seed with defaults (optional)
            if (events.length === 0) {
              // seed default events (one-time)
              const defaults = [
                {
                  name: "Venetian Masquerade Gala",
                  type: "gala",
                  date: "15 June 2026",
                  time: "8:00 PM CET",
                  location: "Palazzo Pisani, Venice",
                  dress: "Black Tie & Mask",
                  description: "An enchanting evening of mystery and grandeur.",
                  icon: "fa-mask",
                  image: "https://picsum.photos/seed/venicegala/400/250",
                },
                {
                  name: "Côte d’Azur Yacht Soirée",
                  type: "yacht",
                  date: "22 June 2026",
                  time: "5:00 PM",
                  location: "Monaco Harbour",
                  dress: "Nautical Chic",
                  description: "Sunset cocktails aboard a 150‑ft superyacht.",
                  icon: "fa-ship",
                  image: "https://picsum.photos/seed/yachtparty/400/250",
                },
                {
                  name: "Royal Ascot Polo Brunch",
                  type: "polo",
                  date: "28 June 2026",
                  time: "11:00 AM",
                  location: "Windsor Great Park, UK",
                  dress: "Summer Elegance & Hats",
                  description:
                    "Champagne brunch with prime views of the polo field.",
                  icon: "fa-horse-head",
                  image: "https://picsum.photos/seed/polo/400/250",
                },
                {
                  name: "Tuscan Vineyard Retreat",
                  type: "wine",
                  date: "5 July 2026",
                  time: "4:00 PM",
                  location: "Castello di Verrazzano, Tuscany",
                  dress: "Resort Chic",
                  description: "Private wine tasting through ancient cellars.",
                  icon: "fa-wine-glass",
                  image: "https://picsum.photos/seed/tuscanywine/400/250",
                },
                {
                  name: "Midnight Piano Recital",
                  type: "concert",
                  date: "12 July 2026",
                  time: "10:00 PM",
                  location: "Opera Garnier, Paris",
                  dress: "Cocktail Attire",
                  description:
                    "An intimate concert with world‑renowned pianist.",
                  icon: "fa-music",
                  image: "https://picsum.photos/seed/pianorecital/400/250",
                },
                {
                  name: "Santorini Sunset Dinner",
                  type: "wine",
                  date: "19 July 2026",
                  time: "7:00 PM",
                  location: "Clifftop Villa, Oia",
                  dress: "Mediterranean White",
                  description: "A private chef’s table experience.",
                  icon: "fa-utensils",
                  image: "https://picsum.photos/seed/santorini/400/250",
                },
                {
                  name: "St. Moritz Ice Gala",
                  type: "gala",
                  date: "2 August 2026",
                  time: "7:30 PM",
                  location: "Badrutt’s Palace, St. Moritz",
                  dress: "Winter Glamour",
                  description:
                    "A frost‑kissed ballroom filled with ice sculptures.",
                  icon: "fa-snowflake",
                  image: "https://picsum.photos/seed/icegala/400/250",
                },
                {
                  name: "Capri Blue Grotto Cruise",
                  type: "yacht",
                  date: "10 August 2026",
                  time: "3:00 PM",
                  location: "Marina Grande, Capri",
                  dress: "Resort Casual",
                  description: "Day cruise around the Faraglioni rocks.",
                  icon: "fa-water",
                  image: "https://picsum.photos/seed/capri/400/250",
                },
              ];
              for (const ev of defaults) {
                await window.addDoc(window.collection(window.db, "events"), ev);
              }
              // re-fetch
              return await getEvents();
            }
            return events;
          }

          // ── Firestore: invitation helpers ─────────
          async function getExistingInvitation(eventId) {
            const session = JSON.parse(
              localStorage.getItem("reh_user") || "{}",
            );
            if (!session.email) return null;
            const q = window.query(
              window.collection(window.db, "event_invitations"),
              window.where("userEmail", "==", session.email),
              window.where("eventId", "==", eventId),
            );
            const snap = await window.getDocs(q);
            return snap.empty
              ? null
              : { id: snap.docs[0].id, ...snap.docs[0].data() };
          }

          async function requestInvitation(eventId, eventName) {
            const session = JSON.parse(
              localStorage.getItem("reh_user") || "{}",
            );
            if (!session.email) {
              window.location.href = "index.html?redirect=login.html";
              return;
            }
            if (!isEligible("premium-monthly")) {
              showToast("🔒 Upgrade to Premium to request event invitations.");
              return;
            }

            try {
              await window.addDoc(
                window.collection(window.db, "event_invitations"),
                {
                  eventId,
                  eventName,
                  userEmail: session.email,
                  userName:
                    (session.firstName + " " + session.lastName).trim() ||
                    session.email,
                  timestamp: window.serverTimestamp
                    ? window.serverTimestamp()
                    : new Date(),
                  status: "pending",
                },
              );
              showToast(
                `✨ Your invitation request for "${eventName}" has been sent.`,
              );
              renderEvents(activeFilter); // refresh buttons
            } catch (err) {
              console.error(err);
              showToast("Failed to send request.");
            }
          }

          // ── Render event cards ───────────────────
          async function renderEvents(filter = "all") {
            // setTimeout(() => {
            //  eventsGrid.innerHTML = `<div> Unable to connect to the servers</div>`
            // }, 30000);
            eventsGrid.innerHTML =
              '<div style="text-align:center; padding:3rem; color:var(--muted);"><i class="fa-solid fa-spinner fa-spin"></i> Loading events…</div>';

            const allEvents = await getEvents();
            const filtered =
              filter === "all"
                ? allEvents
                : allEvents.filter((e) => e.type === filter);

            if (filtered.length === 0) {
              eventsGrid.innerHTML =
                '<div style="text-align:center; padding:3rem; color:var(--text-muted);"><i class="fa-regular fa-calendar"></i><p>No events match this filter.</p></div>';
              return;
            }

            // Prepare button states asynchronously
            const cardsHTML = await Promise.all(
              filtered.map(async (ev, i) => {
                const invitation = await getExistingInvitation(ev.id);
                const isEligiblePremium = isEligible("premium-monthly");
                let btnText = isEligiblePremium
                  ? "Request Invitation"
                  : "Upgrade to Unlock";
                let btnDisabled = !isEligiblePremium;
                let btnIcon = isEligiblePremium
                  ? "fa-envelope-open-text"
                  : "fa-lock";

                if (invitation) {
                  if (invitation.status === "pending") btnText = "Pending";
                  else if (invitation.status === "confirmed")
                    btnText = "Confirmed";
                  else if (invitation.status === "declined")
                    btnText = "Declined";
                  btnDisabled = true;
                  btnIcon = "fa-check";
                }

                return `
          <div class="event-card" data-index="${i}">
            <div class="event-img-panel" style="background-image: url('${ev.image || ""}');">
              <div class="event-img-fallback"><i class="fa-solid ${ev.icon || "fa-calendar"}"></i></div>
              <div class="event-type-badge">
                <i class="fa-solid ${ev.icon || "fa-star"}"></i> 
                ${ev.type.charAt(0).toUpperCase() + ev.type.slice(1)}
              </div>
            </div>
            <div class="event-card-body">
              <div class="event-date"><i class="fa-regular fa-calendar"></i> ${ev.date} · ${ev.time}</div>
              <div class="event-name">${ev.name}</div>
              <div class="event-meta">
                <span><i class="fa-solid fa-location-dot"></i> ${ev.location}</span>
              </div>
              <div class="dress-code"><i class="fa-solid fa-vest"></i> ${ev.dress}</div>
              <p class="event-desc">${ev.description || ""}</p>
              <button class="btn-request" data-event-name="${ev.name}" data-event-id="${ev.id}"
                ${btnDisabled ? "disabled" : ""}
                style="${btnDisabled ? "opacity:0.7; cursor:not-allowed;" : ""}">
                <i class="fa-solid ${btnIcon}"></i> ${btnText}
              </button>
            </div>
          </div>
        `;
              }),
            );

            eventsGrid.innerHTML = cardsHTML.join("");

            // Attach event listeners to request buttons
            document
              .querySelectorAll(".btn-request:not([disabled])")
              .forEach((btn) => {
                btn.addEventListener("click", function (e) {
                  e.stopPropagation();
                  const eventName = this.getAttribute("data-event-name");
                  const eventId = this.getAttribute("data-event-id");
                  requestInvitation(eventId, eventName);
                });
              });

            initIntersectionObserver();
          }

          // ── Intersection Observer ─────────────────
          function initIntersectionObserver() {
            const cards = document.querySelectorAll(".event-card");
            if (!("IntersectionObserver" in window)) {
              cards.forEach((c) => c.classList.add("card-visible"));
              return;
            }
            const observer = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    const card = entry.target;
                    const index = parseInt(
                      card.getAttribute("data-index") || "0",
                    );
                    card.style.transitionDelay = index * 0.08 + "s";
                    card.classList.add("card-visible");
                    observer.unobserve(card);
                  }
                });
              },
              { threshold: 0.1, rootMargin: "0px 0px -30px 0px" },
            );
            cards.forEach((card) => observer.observe(card));
          }

          // ── Filter chip handlers ─────────────────
          filterChips.forEach((chip) => {
            chip.addEventListener("click", function () {
              filterChips.forEach((c) => c.classList.remove("active"));
              this.classList.add("active");
              activeFilter = this.getAttribute("data-type");
              renderEvents(activeFilter);
              eventsGrid.scrollIntoView({ behavior: "smooth", block: "start" });
            });
          });

          // ── Particles ────────────────────────────
          function createParticles() {
            const container = document.getElementById("particlesContainer");
            const colors = [
              "rgba(200,160,60,0.5)",
              "rgba(220,180,70,0.4)",
              "rgba(180,35,50,0.4)",
              "rgba(30,55,150,0.4)",
              "rgba(255,255,255,0.3)",
            ];
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 35; i++) {
              const p = document.createElement("div");
              p.className =
                "particle" + (Math.random() > 0.65 ? " diamond" : "");
              const size = Math.random() * 6 + 2;
              p.style.width = size + "px";
              p.style.height = size + "px";
              p.style.left = Math.random() * 100 + "%";
              p.style.backgroundColor =
                colors[Math.floor(Math.random() * colors.length)];
              p.style.animationDuration = Math.random() * 18 + 10 + "s";
              p.style.animationDelay = Math.random() * 15 + "s";
              if (p.classList.contains("diamond")) {
                p.style.backgroundColor = "transparent";
                p.style.border =
                  "1px solid " +
                  colors[Math.floor(Math.random() * colors.length)];
              }
              frag.appendChild(p);
            }
            container.appendChild(frag);
          }

          // ── Requests tracker dropdown (Firestore) ──
          async function updateRequestsBadge() {
            const session = JSON.parse(
              localStorage.getItem("reh_user") || "{}",
            );
            if (!session.email) {
              document.getElementById("requestsBadge").style.display = "none";
              return;
            }
            const q = window.query(
              window.collection(window.db, "event_invitations"),
              window.where("userEmail", "==", session.email),
              window.where("status", "==", "pending"),
            );
            const snap = await window.getDocs(q);
            const badge = document.getElementById("requestsBadge");
            badge.textContent = snap.size;
            badge.style.display = snap.size > 0 ? "flex" : "none";
          }

          async function renderRequestsDropdown() {
            const session = JSON.parse(
              localStorage.getItem("reh_user") || "{}",
            );
            const email = session.email;
            const list = document.getElementById("requestsList");
            if (!list) return;

            if (!email) {
              list.innerHTML =
                '<p style="color:var(--text-muted);">Log in to see requests.</p>';
              return;
            }

            const q = window.query(
              window.collection(window.db, "event_invitations"),
              window.where("userEmail", "==", email),
              window.orderBy("timestamp", "desc"),
            );
            const snap = await window.getDocs(q);
            if (snap.empty) {
              list.innerHTML =
                '<p style="color:var(--text-muted);">No event requests yet.</p>';
              return;
            }

            const requests = [];
            snap.forEach((doc) => requests.push({ id: doc.id, ...doc.data() }));

            list.innerHTML = requests
              .map((r) => {
                const statusColor =
                  r.status === "confirmed"
                    ? "#2ecc71"
                    : r.status === "declined"
                      ? "#e74c3c"
                      : "#f39c12";
                return `
        <div class="notif-item" style="opacity:${r.status === "declined" ? 0.6 : 1};">
          <div class="notif-title">${r.eventName}</div>
          <div style="font-size:0.7rem; color:var(--text-muted);">${new Date(r.timestamp?.seconds ? r.timestamp.seconds * 1000 : r.timestamp).toLocaleString()}</div>
          <div style="font-size:0.75rem; margin-top:0.2rem; color:${statusColor}; font-weight:600;">${r.status}</div>
        </div>`;
              })
              .join("");
          }

          // Bell toggle
          document
            .getElementById("requestsBell")
            ?.addEventListener("click", (e) => {
              e.stopPropagation();
              document
                .getElementById("requestsDropdown")
                .classList.toggle("show");
              renderRequestsDropdown();
            });
          document.addEventListener("click", () => {
            document
              .getElementById("requestsDropdown")
              ?.classList.remove("show");
          });
          document
            .getElementById("refreshRequestsBtn")
            ?.addEventListener("click", (e) => {
              e.stopPropagation();
              updateRequestsBadge();
              renderRequestsDropdown();
            });

          // Initial loads
          async function init() {
            createParticles();
            await renderEvents("all");
            updateRequestsBadge();
          }
          init();
        }

        // Wait for Firebase, then start
        waitForFirebase(startApp);
      })();
    </script>
    <script src="assets/toadmin.js"></script>
    <script>
      // Wait for the dynamic navigation to finish loading
      function waitForNav() {
        return new Promise((resolve) => {
          const check = setInterval(() => {
            const bell = document.getElementById("requestsBell");
            if (bell) {
              clearInterval(check);
              resolve();
            }
          }, 50);
          setTimeout(() => resolve(), 3000); // fallback
        });
      }

      waitForNav().then(() => {
        // Now attach listeners (your existing code for bell/dropdown)
        document
          .getElementById("requestsBell")
          ?.addEventListener("click", (e) => {
            e.stopPropagation();
            document
              .getElementById("requestsDropdown")
              .classList.toggle("show");
            // also call renderRequestsDropdown() if needed
          });
        document.addEventListener("click", () => {
          document.getElementById("requestsDropdown")?.classList.remove("show");
        });
        document
          .getElementById("refreshRequestsBtn")
          ?.addEventListener("click", (e) => {
            e.stopPropagation();
            updateRequestsBadge();
            renderRequestsDropdown();
          });
        // Also initialise badge & dropdown content
        updateRequestsBadge();
        renderRequestsDropdown();
      });
    </script>
  </body>
</html>
