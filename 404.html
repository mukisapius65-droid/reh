<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Reh</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --deep-navy: #080c24;
            --gold: #c9a84c;
            --gold-light: #dfc278;
            --champagne: #f0e4c8;
            --pure-white: #ffffff;
            --text-secondary: #c5bfb3;
            --text-muted: #8a857a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --love-pink: #ff6b8a;
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--deep-navy);
            color: var(--pure-white);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            letter-spacing: 0.01em;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        ::selection {
            color: var(--champagne);
            background: rgba(180, 30, 50, 0.5);
        }

        /* ── Animated Background ─────────────────── */
        .bg-orbit {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-orbit::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -20%;
            width: 140%;
            height: 160%;
            background:
                radial-gradient(ellipse at 30% 30%, rgba(255, 107, 138, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(200, 160, 60, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(20, 40, 120, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(180, 30, 50, 0.2) 0%, transparent 50%);
            animation: bgPulse 10s ease-in-out infinite;
        }
        @keyframes bgPulse {
            0%,
            100% {
                opacity: 0.9;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.03);
            }
        }

        /* ── Floating Hearts / Lanterns ───────────── */
        .hearts-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .floating-heart {
            position: absolute;
            color: var(--love-pink);
            font-size: 1.2rem;
            animation: floatHeart 8s ease-in-out infinite;
            opacity: 0;
            filter: drop-shadow(0 0 8px rgba(255, 107, 138, 0.5));
            pointer-events: none;
        }
        .floating-heart:nth-child(odd) {
            color: var(--gold-light);
            filter: drop-shadow(0 0 8px rgba(200, 160, 60, 0.5));
        }
        @keyframes floatHeart {
            0% {
                transform: translateY(105vh) translateX(0) scale(0.4);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            50% {
                opacity: 0.9;
                transform: translateY(40vh) translateX(30px) scale(1.1);
            }
            90% {
                opacity: 0.2;
            }
            100% {
                transform: translateY(-10vh) translateX(-20px) scale(0.3);
                opacity: 0;
            }
        }

        /* ── Main Card ────────────────────────────── */
        .error-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            background: rgba(15, 20, 50, 0.55);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 36px;
            padding: 2.8rem 2rem 2.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(200, 155, 60, 0.15);
            text-align: center;
            animation: cardAppear 0.7s ease-out;
            transition: box-shadow 0.4s;
        }
        .error-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 36px;
            padding: 2px;
            background: linear-gradient(160deg, rgba(255, 107, 138, 0.4) 0%, rgba(200, 160, 70, 0.3) 40%, rgba(20, 45, 130, 0.3) 70%, rgba(255, 150, 180, 0.4) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.8;
            z-index: 0;
        }
        .error-card>* {
            position: relative;
            z-index: 1;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Compass Rose Illustration ────────────── */
        .compass-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
        }
        .compass-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(200, 160, 60, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: gentleRotate 20s linear infinite;
            box-shadow: 0 0 25px rgba(200, 160, 60, 0.2);
        }
        @keyframes gentleRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        .compass-needle {
            position: absolute;
            width: 4px;
            height: 50%;
            background: linear-gradient(to top, var(--crimson), var(--gold));
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 1;
        }
        .compass-points {
            position: absolute;
            inset: 8%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--gold-light);
            z-index: 0;
        }
        .compass-points i {
            filter: drop-shadow(0 0 10px rgba(200, 160, 60, 0.5));
        }

        /* ── Error Text ────────────────────────────── */
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            background: linear-gradient(180deg, #ffffff 0%, #f0d9b0 40%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 6px rgba(200, 150, 50, 0.4));
            margin: 0.5rem 0;
        }
        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--gold-light);
            margin-bottom: 0.6rem;
        }
        .error-message {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            font-style: italic;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--crimson), var(--royal-blue));
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 8px 25px rgba(200, 40, 55, 0.5);
            text-decoration: none;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(200, 40, 55, 0.8);
            background: linear-gradient(135deg, #a01e30, #1a3a80);
        }

        /* ── Toast ─────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(20, 30, 60, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--gold);
            color: var(--champagne);
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 0.85rem;
            z-index: 999;
            transition: transform 0.4s var(--transition-bounce);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 2rem 1.5rem;
            }
            .error-code {
                font-size: 3.5rem;
            }
            .error-title {
                font-size: 1.4rem;
            }
            .compass-container {
                width: 80px;
                height: 80px;
            }
            .compass-circle {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orbit"></div>
    <div class="hearts-container" id="heartsContainer"></div>
    <div class="toast" id="toast"><i class="fa-solid fa-heart"></i> <span id="toastMessage"></span></div>

    <div class="error-card">
        <!-- Compass rose illustration -->
        <div class="compass-container">
            <div class="compass-circle">
                <div class="compass-points">
                    <i class="fa-solid fa-star"></i>
                </div>
                <div class="compass-needle"></div>
            </div>
        </div>

        <div class="error-code">404</div>
        <h1 class="error-title">Lost at Sea, Dear One</h1>
        <p class="error-message">
            The page you're searching for has drifted beyond the horizon.<br>
            It may have been moved, renamed, or carried away by the tide.<br>
            Our deepest apologies — let us guide you back to warmer shores.
        </p>
        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-house"></i> Return to the Circle
        </a>
    </div>

    <script>
        (function() {
            // ── Floating hearts ──────────────────────
            const heartsContainer = document.getElementById('heartsContainer');
            const heartIcons = ['❤️', '💕', '💖', '💗', '💘', '✨', '🌸', '🥀'];
            const goldHearts = ['💛', '⭐', '🌟', '✨'];

            function createHeart() {
                const heart = document.createElement('span');
                heart.className = 'floating-heart';
                heart.textContent = (Math.random() > 0.6 ? goldHearts : heartIcons)[Math.floor(Math.random() * 4)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 8 + 6) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                heartsContainer.appendChild(heart);
                setTimeout(() => heart.remove(), 13000);
            }
            setInterval(createHeart, 500);
            for (let i = 0; i < 10; i++) setTimeout(createHeart, i * 200);

            // ── Toast (optional, for copy-paste tracking) ──
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            let toastTimer;

            function showToast(msg) {
                if (toastTimer) clearTimeout(toastTimer);
                toastMessage.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
            }

            // Automatically show a gentle message after a moment
            setTimeout(() => {
                showToast('🌸 We apologize for the inconvenience. The circle awaits.');
            }, 2000);

            console.log('%c💔 404 %c— Even lost paths can lead to beautiful places.',
                'color:#c9a84c;', 'color:#c5bfb3;');
        })();
    </script>
</body>
</html>
