<html lang="en">
<head>

  <style>
    :root {
      --deep-navy: #080c24;
      --gold: #c9a84c;
      --gold-light: #dfc278;
      --champagne: #f0e4c8;
      --crimson: #8b1a2b;
      --royal-blue: #162464;
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --glass-card: rgba(15,20,50,0.55);
      --text: #f0ece6;
      --text2: #c5bfb3;
      --muted: #8a857a;
      --love-pink: #ff6b8a;
      --danger: #e74c3c;
      --success: #2ecc71;
      --shadow-gold: 0 0 40px rgba(200,155,60,0.2);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--deep-navy);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6;}
    .bg-orbit{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 30% 30%,rgba(255,107,138,0.15) 0%,transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(200,160,60,0.1) 0%,transparent 50%);animation:bgPulse 10s infinite;}
    @keyframes bgPulse{0%,100%{opacity:0.9;}50%{opacity:1;}}
    .main-wrapper{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:2rem 1rem;}
    .profile-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:2rem;}
    @media(max-width:768px){.profile-grid{grid-template-columns:1fr;}}
    .profile-left,.profile-right{background:var(--glass-card);border:1px solid var(--glass-border);border-radius:24px;padding:2rem;backdrop-filter:blur(20px);}
    .profile-left{display:flex;flex-direction:column;align-items:center;}
    .photo-gallery{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;margin-bottom:1.5rem;}
    .photo-gallery img{width:80px;height:80px;border-radius:12px;object-fit:cover;border:2px solid transparent;cursor:pointer;transition:0.3s;}
    .photo-gallery img:hover,.photo-gallery img.active{border-color:var(--gold);transform:scale(1.05);}
    .main-photo{width:200px;height:200px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 35px rgba(200,160,60,0.5);margin-bottom:1rem;}
    .username{color:var(--muted);font-size:0.9rem;margin-bottom:0.5rem;}
    .display-name{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--text);display:flex;align-items:center;gap:0.5rem;justify-content:center;}
    .verified-badge{color:#3498db;font-size:1.2rem;}
    .age-badge{background:rgba(200,155,60,0.2);color:var(--gold-light);padding:4px 12px;border-radius:50px;display:inline-block;margin:0.5rem 0;}
    .online-status{display:flex;align-items:center;gap:0.4rem;font-size:0.8rem;color:var(--text2);}
    .online-dot{width:10px;height:10px;border-radius:50%;background:#4cfa7c;box-shadow:0 0 10px #4cfa7c;}
    .offline-dot{width:10px;height:10px;border-radius:50%;background:#7a756e;}
    .info-row{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin:1rem 0;color:var(--text2);}
    .info-row span{display:flex;align-items:center;gap:0.4rem;}
    .profile-right h3{font-family:'Playfair Display',serif;color:var(--gold-light);margin-bottom:1rem;border-bottom:1px solid var(--glass-border);padding-bottom:0.5rem;}
    .detail-item{margin-bottom:0.8rem;font-size:0.9rem;color:var(--text2);}
    .detail-item i{margin-right:0.5rem;color:var(--gold-light);width:20px;}
    .detail-item strong{color:var(--text);}
    .action-buttons{display:flex;gap:1rem;flex-wrap:wrap;margin:1.5rem 0;}
    .btn{flex:1;min-width:130px;padding:12px;border-radius:50px;font-weight:600;text-align:center;cursor:pointer;transition:0.3s;display:flex;align-items:center;justify-content:center;gap:0.5rem;border:none;}
    .btn-gift{background:linear-gradient(135deg,#c9a84c,#f0e4c8);color:#080c24;}
    .btn-chat{background:linear-gradient(135deg,var(--royal-blue),var(--crimson));color:white;}
    .btn-block{background:transparent;border:1px solid var(--danger);color:var(--danger);}
    .btn-block:hover{background:var(--danger);color:white;}
    .btn-gift:disabled,.btn-chat:disabled{opacity:0.6;cursor:not-allowed;box-shadow:none;}
    .bookmark-icon{cursor:pointer;font-size:1.3rem;margin-left:0.5rem;color:var(--gold-light);}
    /* Chat panel */
    .chat-panel{position:fixed;bottom:0;left:0;right:0;background:rgba(10,15,35,0.98);backdrop-filter:blur(30px);border-top:1px solid var(--gold);padding:1rem;z-index:1000;transform:translateY(100%);transition:transform 0.3s;max-height:60vh;display:flex;flex-direction:column;}
    .chat-panel.open{transform:translateY(0);}
    .chat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;color:var(--gold-light);}
    .chat-messages{flex:1;overflow-y:auto;padding:0.5rem 0;display:flex;flex-direction:column;gap:0.5rem;}
    .chat-msg{max-width:75%;padding:0.5rem 0.8rem;border-radius:12px;font-size:0.85rem;word-wrap:break-word;position:relative;}
    .chat-msg.sent{align-self:flex-end;background:rgba(200,160,60,0.2);border:1px solid var(--gold);color:var(--text);}
    .chat-msg.received{align-self:flex-start;background:rgba(255,255,255,0.05);color:var(--text);}
    .chat-msg small{display:block;font-size:0.65rem;color:var(--muted);margin-top:0.2rem;}
    .msg-status{font-size:0.7rem;margin-left:0.3rem;}
    .single-check{color:var(--muted);}
    .double-faded{color:var(--muted);opacity:0.7;}
    .double-golden{color:var(--gold);}
    .chat-input-area{display:flex;gap:0.5rem;margin-top:0.5rem;}
    .chat-input-area input{flex:1;padding:0.5rem;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);border-radius:20px;color:white;outline:none;}
    .chat-input-area button{background:linear-gradient(135deg,var(--crimson),var(--royal-blue));border:none;color:white;border-radius:50%;width:36px;height:36px;cursor:pointer;}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(20,30,60,0.9);border:1px solid var(--gold);color:var(--champagne);padding:14px 28px;border-radius:50px;z-index:9999;transition:transform 0.4s;display:flex;align-items:center;gap:8px;font-size:0.85rem;}
    .toast.show{transform:translateX(-50%) translateY(0);}
    .invisible{display:none!important;}
  </style>
</head>

(function() {
  function waitForFirebase(cb) {
    if (window.db && window.collection) cb();
    else {
      let tries = 0;
      const timer = setInterval(() => {
        if (window.db && window.collection) { clearInterval(timer); cb(); }
        if (++tries > 50) { clearInterval(timer); console.error('Firebase not ready'); }
      }, 100);
    }
  }

  function startApp() {
    const SESSION_KEY = 'reh_user';
    const CACHE_BOOKMARKS = 'reh_cache_bookmarks';   // ← add this
    let convId = null, chatUnsubscribe = null;
    let bookmarkedEmails = new Set();

    // Helpers
    function getCurrentUser() { return JSON.parse(localStorage.getItem(SESSION_KEY)||'{}'); }
    function showToast(msg) {
      const t = document.getElementById('toast'), s = document.getElementById('toastMsg');
      if(t&&s){ s.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
    }

    // Online check from Firestore lastActive
    function isUserOnline(profile) {
      if (!profile || !profile.lastActive) return false;
      const now = Date.now();
      const ms = profile.lastActive?.seconds ? profile.lastActive.seconds*1000 : profile.lastActive;
      return (now - ms) < 20000;
    }

    // Bookmark cache loader
    async function loadBookmarkCache() {
      const session = getCurrentUser();
      if (!session.email) return;
      const snap = await window.getDocs(window.collection(window.db, "users", session.email, "bookmarks"));
      bookmarkedEmails.clear();
      snap.forEach(doc => bookmarkedEmails.add(doc.id));
    }

    // Optimistic bookmark toggle
async function toggleBookmark(targetEmail, btn) {
  const session = getCurrentUser();
  if (!session.email) { window.location.href='index.html?redirect=login.html'; return; }

  // If btn is the icon itself, use it; otherwise find icon inside
  const icon = btn.classList.contains('fa-bookmark') ? btn : btn.querySelector('i.fa-bookmark');
  if (!icon) return;

  const currently = icon.classList.contains('fa-solid');
  icon.classList.toggle('fa-solid');
  icon.classList.toggle('fa-regular');
  if (currently) bookmarkedEmails.delete(targetEmail); else bookmarkedEmails.add(targetEmail);
  sessionStorage.setItem(CACHE_BOOKMARKS, JSON.stringify([...bookmarkedEmails]));

  const ref = window.doc(window.db, "users", session.email, "bookmarks", targetEmail);
  try {
    if (currently) { await window.deleteDoc(ref); showToast('🔖 Bookmark removed.'); }
    else {
      const targetDoc = await window.getDoc(window.doc(window.db, "users", targetEmail));
      if (!targetDoc.exists()) throw new Error('User not found');
      const t = targetDoc.data();
      await window.setDoc(ref, {
        email: targetEmail, firstName: t.firstName||'', lastName: t.lastName||'',
        age: t.age||'', avatar: t.avatar||'', location: t.location||'',
        addedAt: new Date()
      });
      showToast('🔖 Profile bookmarked.');
    }
  } catch(e) {
    console.error(e);
    icon.classList.toggle('fa-solid');
    icon.classList.toggle('fa-regular');
    if (currently) bookmarkedEmails.add(targetEmail); else bookmarkedEmails.delete(targetEmail);
    sessionStorage.setItem(CACHE_BOOKMARKS, JSON.stringify([...bookmarkedEmails]));
    showToast('Could not update bookmark.');
  }
}

    // Gift helpers
    async function getGiftCount(target) {
      const q = window.query(window.collection(window.db,"gifts"), window.where("to","==",target), window.where("giftType","==","diamond_rose"));
      return (await window.getDocs(q)).size;
    }
    async function hasSentGift(from, to) {
      const q = window.query(window.collection(window.db,"gifts"), window.where("from","==",from), window.where("to","==",to), window.where("giftType","==","diamond_rose"));
      return !(await window.getDocs(q)).empty;
    }
    async function sendGift(target) {
      const cur = getCurrentUser();
      if (!cur) return showToast('Login required.');
      if (cur.email === target) return showToast('Cannot send to yourself.');
      if (await hasSentGift(cur.email, target)) return showToast('Already sent.');
      try {
        await window.addDoc(window.collection(window.db,"gifts"),{
          from: cur.email, fromName: `${cur.firstName} ${cur.lastName}`.trim()||cur.email,
          to: target, giftType:'diamond_rose', timestamp: Date.now()
        });
        await window.addDoc(window.collection(window.db,"notifications"),{
          title:'💎 You received a gift!', body:`${cur.firstName||'Someone'} sent you a Diamond Rose.`,
          timestamp: new Date(), targetEmail: target, readBy:[]
        });
        showToast('💎 Diamond Rose sent!');
        const countEl = document.getElementById('giftCount');
        if (countEl) countEl.textContent = await getGiftCount(target);
        const btn = document.getElementById('giftBtn');
        if (btn) { btn.disabled=true; btn.textContent='Gift Sent'; }
      } catch(e) { console.error(e); showToast('Failed to send gift.'); }
    }

    // Encryption
    async function deriveKey(salt,pass) {
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveKey']);
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    }
    async function encryptMessage(text,key) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));
      return {iv:Array.from(iv),ciphertext:Array.from(new Uint8Array(ct))};
    }
    async function decryptMessage(obj,key) {
      const iv = new Uint8Array(obj.iv), ct = new Uint8Array(obj.ciphertext);
      return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
    }
    function getConvId(a,b){ return [a,b].sort().join('_'); }

    // Chat
    async function openChat(targetEmail) {
      const cur = getCurrentUser();
      if (!cur) return;
      convId = getConvId(cur.email,targetEmail);
      // Reset unread for current user
await window.updateDoc(window.doc(window.db, "chats", convId), {
  [`unread_${cur.email}`]: 0
});
      const key = await deriveKey(convId,convId);
      const ref = window.collection(window.db,"chats",convId,"messages");
      const q = window.query(ref, window.orderBy("timestamp","asc"));
      if (chatUnsubscribe) chatUnsubscribe();
      chatUnsubscribe = window.onSnapshot(q, async (snap) => {
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        for (const doc of snap.docs) {
          const msg = doc.data();
          let text = '';
          try { text = typeof msg.text==='string'? msg.text : await decryptMessage(msg.text,key); }
          catch(e) { text = '[Decryption failed]'; }
          const div = document.createElement('div');
          div.className = `chat-msg ${msg.from===cur.email?'sent':'received'}`;
          const time = new Date(msg.timestamp?.seconds?msg.timestamp.seconds*1000:msg.timestamp).toLocaleString();
          // Message status: single check if sent, double faded if received but not read, golden double if read
          let statusHtml = '';
          if (msg.from === cur.email) {
            if (msg.read) statusHtml = '<span class="msg-status double-golden"><i class="fa-solid fa-check-double"></i></span>';
            else statusHtml = '<span class="msg-status single-check"><i class="fa-solid fa-check"></i></span>';
          } else {
            // For received messages, we can mark as read when the chat is opened
            if (!msg.read) {
              // Mark as read
              await window.updateDoc(window.doc(window.db,"chats",convId,"messages",doc.id),{read:true});
              msg.read = true;
            }
          }
          div.innerHTML = `${text}<small>${time} ${statusHtml}</small>`;
          container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
      });
    }

    async function sendMessage(targetEmail) {
  const cur = getCurrentUser();
  if (!cur || !convId) return;
  const input = document.getElementById('chatMessageInput');
  const text = input.value.trim();
  if (!text) return;
  const key = await deriveKey(convId, convId);
  const enc = await encryptMessage(text, key);
  try {
    await window.addDoc(window.collection(window.db,"chats",convId,"messages"),{
      from: cur.email,
      text: enc,
      timestamp: new Date(),
      read: false,
      previewText: text.substring(0, 60)
    });

    // Update parent chat doc with participants and unread count for recipient
    const chatRef = window.doc(window.db, "chats", convId);
    await window.setDoc(chatRef, {
      participants: [cur.email, targetEmail],
      lastTimestamp: window.serverTimestamp ? window.serverTimestamp() : new Date(),
      [`unread_${targetEmail}`]: window.increment ? window.increment(1) : (await window.getDoc(chatRef)).data()?.[`unread_${targetEmail}`] + 1 || 1
    }, { merge: true });

    input.value = '';
  } catch(e) { console.error(e); showToast('Failed to send message.'); }
}

    // Load profile
    const urlParams = new URLSearchParams(window.location.search);
    const targetEmail = urlParams.get('email');
    const container = document.getElementById('profileContent');

    if (!targetEmail) {
      container.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;">No user specified.</p>';
    } else {
      container.innerHTML = '<div style="padding:2rem;color:var(--muted);grid-column:1/-1;text-align:center;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p>Loading profile…</p></div>';
      
      //auto open chat on clicking external chat button      
      function autoOpenChatIfNeeded(targetEmail) {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('chat') === 'open') {
          // Wait for the DOM to be fully updated
          setTimeout(() => {
            const chatPanel = document.getElementById('chatPanel');
            if (chatPanel && !chatPanel.classList.contains('open')) {
              chatPanel.classList.add('open');
              openChat(targetEmail);   // starts the encrypted chat listener
              document.getElementById('chatMessageInput').focus();
            }
            
            // Smoothly scroll to the chat panel or a trigger button
            const chatTrigger = document.getElementById('chatBtn') || chatPanel;
            if (chatTrigger) {
              chatTrigger.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 300);
        }
      }
      
      (async function fetchAndRender() {

          const cur = getCurrentUser();
          if (cur && profile.blocked && profile.blocked.includes(cur.email)) {

            return;

          const mainPhoto = photos[0];
          const username = profile.username ? '@'+profile.username : '@'+(profile.email||'').split('@')[0];
          const isVerified = profile.plan === 'elite-annual';
          // Build HTML
          container.innerHTML = `
            <div class="profile-left">
              <div class="photo-gallery" id="photoGallery">
                ${photos.map((p,i) => `<img src="${p}" alt="Photo ${i+1}" class="${i===0?'active':''}" onclick="document.querySelector('.main-photo').src='${p}'">`).join('')}
              </div>
              <img class="main-photo" src="${mainPhoto}" alt="${profile.firstName}">
              <div class="username">${username}</div>
              <div class="display-name">${profile.firstName} ${profile.lastName} ${isVerified?'<i class="fa-solid fa-circle-check verified-badge" title="Verified Elite"></i>':''}</div>
              <div class="age-badge">${profile.age||''}</div>
              <div class="online-status">${online?'<span class="online-dot"></span> Online':'<span class="offline-dot"></span> Offline'}</div>
              <div class="info-row">
                <span><i class="fa-solid fa-location-dot"></i> ${profile.location||'Unknown'}</span>
                ${profile.gender?`<span><i class="fa-solid fa-venus-mars"></i> ${profile.gender}</span>`:''}
              </div>
            </div>
            <div class="profile-right">
              <h3><i class="fa-solid fa-user"></i> About</h3>
              <div class="detail-item"><i class="fa-solid fa-quote-left"></i> ${profile.bio||'No bio yet.'}</div>
              <div class="detail-item"><i class="fa-solid fa-heart"></i> <strong>Interests:</strong> ${profile.interests||'Not specified'}</div>

              <h3><i class="fa-solid fa-circle-info"></i> Personal Details</h3>

              <div class="detail-item"><i class="fa-solid fa-venus-mars"></i> <strong>Interested in:</strong> ${profile.interestedIn||'Not specified'}</div>

              <div class="detail-item"><i class="fa-solid fa-plane-departure"></i> <strong>Favorite Travel:</strong> ${profile.favTravel||'None'}</div>
              <div class="detail-item"><i class="fa-solid fa-heart-circle-plus"></i> <strong>Relationship Goals:</strong> ${profile.relationshipGoals||'Open'}</div>
              ${profile.voiceIntro?`<div class="detail-item"><i class="fa-solid fa-microphone"></i> <a href="${profile.voiceIntro}" target="_blank" style="color:var(--gold-light);">Voice Intro</a></div>`:''}
              ${profile.videoIntro?`<div class="detail-item"><i class="fa-solid fa-video"></i> <a href="${profile.videoIntro}" target="_blank" style="color:var(--gold-light);">Video Intro</a></div>`:''}
              <div class="action-buttons">
                <button class="btn btn-gift" id="giftBtn"><i class="fa-solid fa-gem"></i> Send Diamond Rose</button>
                <button class="btn btn-chat" id="chatBtn"><i class="fa-solid fa-comment"></i> Chat</button>
                <i class="bookmark-icon fa-bookmark ${bookmarkedEmails.has(targetEmail)?'fa-solid':'fa-regular'}" id="bookmarkBtn" data-email="${targetEmail}"></i>
              </div>
              <button class="btn btn-block" id="blockBtn"><i class="fa-solid fa-ban"></i> Block this user</button>
            </div>
          `;

          // Gift button logic
          const giftBtn = document.getElementById('giftBtn');
          if (giftBtn) {
            if (cur && await hasSentGift(cur.email, targetEmail)) {
              giftBtn.disabled = true;
              giftBtn.textContent = 'Gift Sent';
            }
            giftBtn.addEventListener('click', () => sendGift(targetEmail));
          }

          // Bookmark
         // Bookmark
const bookmarkIcon = document.getElementById('bookmarkBtn');
bookmarkIcon.addEventListener('click', function(e) {
  e.stopPropagation();
  // Pass the icon itself as the button, but adjust toggleBookmark to handle it
  toggleBookmark(targetEmail, this);
});

          // Block
          document.getElementById('blockBtn').addEventListener('click', async () => {
            if (!cur) return showToast('Login required.');
            if (cur.email === targetEmail) return showToast('Cannot block yourself.');
            let blocked = cur.blocked || [];
            if (blocked.includes(targetEmail)) return showToast('Already blocked.');
            blocked.push(targetEmail);
            cur.blocked = blocked;
            localStorage.setItem(SESSION_KEY, JSON.stringify(cur));
            try { await window.updateDoc(window.doc(window.db,"users",cur.email),{blocked}); } catch(e){}
            showToast('User blocked.');
            window.history.back();
          });

          // Chat
          const chatPanel = document.getElementById('chatPanel');
          document.getElementById('chatBtn').addEventListener('click', () => {
            if (!cur) return showToast('Login required.');
            chatPanel.classList.add('open');
            openChat(targetEmail);
          });
          document.getElementById('closeChatBtn').addEventListener('click', () => { chatPanel.classList.remove('open'); if(chatUnsubscribe){ chatUnsubscribe(); chatUnsubscribe=null; } });
          document.getElementById('sendChatBtn').addEventListener('click', () => sendMessage(targetEmail));
          document.getElementById('chatMessageInput').addEventListener('keypress', (e) => { if(e.key==='Enter') sendMessage(targetEmail); });
          
          autoOpenChatIfNeeded(targetEmail);
          
          // Track view
          if (cur && cur.email !== targetEmail) {
            const recent = await window.getDocs(window.query(window.collection(window.db,"profileViews"), window.where("viewer","==",cur.email), window.where("viewed","==",targetEmail), window.where("timestamp",">=", Date.now()-3600000)));
            if (recent.empty) {
              await window.addDoc(window.collection(window.db,"profileViews"),{
                viewer: cur.email, viewerName: `${cur.firstName} ${cur.lastName}`.trim()||cur.email,
                viewed: targetEmail, timestamp: Date.now()
              });
            }
          }
        } catch(e) {
          console.error(e);
          container.innerHTML = '<p style="color:var(--danger);grid-column:1/-1;text-align:center;">Failed to load profile.</p>';
        }
      })();
    }

    // Load bookmark cache then fetch
    loadBookmarkCache().then(() => {
      // already fetching in fetchAndRender
    });
  }

  waitForFirebase(startApp);
})();
</script>
<script src="assets/toadmin.js"></script>
</body>
</html>
