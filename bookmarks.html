<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks | Reh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --deep-navy: #080c24; --gold: #c9a84c; --gold-light: #dfc278; --champagne: #f0e4c8;
            --crimson: #8b1a2b; --ruby: #a82035; --royal-blue: #162464;
            --glass-bg: rgba(255,255,255,0.04); --glass-border: rgba(255,255,255,0.08);
            --glass-card: rgba(15,20,50,0.55); --text: #f0ece6; --text2: #c5bfb3; --muted: #8a857a;
            --love-pink: #ff6b8a;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:var(--deep-navy);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6;}
        .bg-orbit{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 30% 30%,rgba(255,107,138,0.15) 0%,transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(200,160,60,0.1) 0%,transparent 50%);animation:bgPulse 10s infinite;}
        @keyframes bgPulse{0%,100%{opacity:0.9;}50%{opacity:1;}}
        .main-wrapper{position:relative;z-index:2;max-width:800px;margin:0 auto;padding:2rem;}
        .profile-card{background:var(--glass-card);border:1px solid var(--glass-border);border-radius:24px;padding:1.5rem;backdrop-filter:blur(20px);display:flex;align-items:center;gap:1.5rem;margin-bottom:1rem;transition:0.3s;text-decoration:none;color:var(--text);}
        .profile-card:hover{border-color:var(--gold);}
        .avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);}
        .info{flex:1;}
        .name{font-family:'Playfair Display',serif;font-size:1.2rem;color:white;}
        .loc{font-size:0.8rem;color:var(--text2);}
        .remove-btn{background:none;border:none;color:var(--love-pink);cursor:pointer;font-size:1.2rem;transition:0.2s;}
        .remove-btn:hover{transform:scale(1.2);}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(20,30,60,0.9);border:1px solid var(--gold);color:var(--champagne);padding:14px 28px;border-radius:50px;z-index:9999;transition:transform 0.4s;display:flex;align-items:center;gap:8px;font-size:0.85rem;}
        .toast.show{transform:translateX(-50%) translateY(0);}
    </style>
</head>
<body>
<div class="bg-orbit"></div>
<div class="toast" id="toast"><i class="fa-solid fa-heart"></i> <span id="toastMsg"></span></div>
<div class="main-wrapper" id="bookmarksList">
    <h2 style="font-family:'Playfair Display',serif;color:var(--gold-light);margin-bottom:2rem;"><i class="fa-solid fa-bookmark"></i> My Bookmarks</h2>
</div>
<script type="module" src="assets/firebase.js"></script>
<script>
(function () {
  // ── Firebase readiness helper ─────────────────
  function waitForFirebase(callback) {
    if (window.db && window.collection && window.getDocs && window.deleteDoc && window.doc) {
      callback();
    } else {
      let attempts = 0;
      const check = setInterval(() => {
        if (window.db && window.collection && window.getDocs && window.deleteDoc && window.doc) {
          clearInterval(check);
          callback();
        }
        attempts++;
        if (attempts > 50) {
          clearInterval(check);
          console.error('Firebase not ready for bookmarks');
        }
      }, 100);
    }
  }

  function startApp() {
    const SESSION_KEY = 'reh_user';
    const container = document.getElementById('bookmarksList');

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function getCurrentUser() {
      const stored = localStorage.getItem(SESSION_KEY);
      return stored ? JSON.parse(stored) : null;
    }

    const user = getCurrentUser();
    if (!user) {
      window.location.href = 'index.html?redirect=login.html';
      return;
    }

    // ── Load bookmarks from Firestore ────────────
    async function loadBookmarks() {
      container.innerHTML = '<p style="color:var(--muted);"><i class="fa-solid fa-spinner fa-spin"></i> Loading bookmarks…</p>';

      try {
        const bookmarksRef = window.collection(window.db, "users", user.email, "bookmarks");
        const snapshot = await window.getDocs(bookmarksRef);
        const bookmarks = [];
        snapshot.forEach(doc => {
          bookmarks.push({ id: doc.id, ...doc.data() });
        });

        // Clear container (keep the heading)
        container.innerHTML = '<h2 style="font-family:\'Playfair Display\',serif;color:var(--gold-light);margin-bottom:2rem;"><i class="fa-solid fa-bookmark"></i> My Bookmarks</h2>';

        if (bookmarks.length === 0) {
          container.innerHTML += '<p style="color:var(--muted);">No bookmarks yet. Start adding profiles you like!</p>';
          return;
        }

        bookmarks.forEach(b => {
          const card = document.createElement('a');
          card.className = 'profile-card';
          card.href = `view-profile.html?email=${b.email}`;
          card.innerHTML = `
            <img src="${b.avatar || 'https://randomuser.me/api/portraits/women/44.jpg'}" class="avatar">
            <div class="info">
              <div class="name">${b.firstName || ''} ${b.lastName || ''}${b.age ? ', ' + b.age : ''}</div>
              <div class="loc"><i class="fa-solid fa-location-dot"></i> ${b.location || 'Unknown'}</div>
            </div>
            <button class="remove-btn" data-email="${b.email}"><i class="fa-solid fa-bookmark"></i></button>
          `;
          container.appendChild(card);
        });

        // Attach remove handlers
        document.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', async function(e) {
            e.preventDefault();
            e.stopPropagation();
            const email = this.getAttribute('data-email');
            try {
              await window.deleteDoc(window.doc(window.db, "users", user.email, "bookmarks", email));
              showToast('🔖 Bookmark removed.');
              loadBookmarks(); // refresh list
            } catch (err) {
              console.error(err);
              showToast('Failed to remove bookmark.');
            }
          });
        });

      } catch (err) {
        console.error(err);
        container.innerHTML += '<p style="color:var(--danger);">Failed to load bookmarks. Please try again.</p>';
      }
    }

    loadBookmarks();
  }

  waitForFirebase(startApp);
})();
</script>
</body>
</html>
